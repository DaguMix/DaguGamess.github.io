<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Top Racer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0a1a;
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;
  display:flex;justify-content:center;align-items:center;
  background-image:radial-gradient(circle at 20% 10%, rgba(120,60,220,.25), transparent 50%),
  radial-gradient(circle at 80% 30%, rgba(0,200,255,.15), transparent 50%);}
#game{position:relative;width:100%;max-width:600px;height:100vh;display:flex;flex-direction:column}
canvas{flex:1;display:block;touch-action:none}

.hud{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;
  pointer-events:none;z-index:5;gap:10px}
.hud-box{background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:8px 16px;font-weight:800;text-align:center;min-width:80px;
  box-shadow:0 8px 32px rgba(0,0,0,.3)}
.hud-box .label{font-size:10px;color:#9aa0c0;letter-spacing:1px;margin-bottom:2px}
.hud-box .value{font-size:20px;color:#5be3ff;text-shadow:0 0 10px rgba(91,227,255,.5)}
.hud-box.speed .value{color:#5bff9d;text-shadow:0 0 10px rgba(91,255,157,.5)}
.hud-box.coins .value{color:#ffd86b;text-shadow:0 0 10px rgba(255,216,107,.5)}
.hud-box.score .value{color:#ff5b7f;text-shadow:0 0 10px rgba(255,91,127,.5)}

.mobile-controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;
  padding:0 20px;z-index:6;pointer-events:none;opacity:0;transition:opacity 0.3s}
@media(max-width:768px){.mobile-controls{opacity:1}}
.mobile-controls .group{display:flex;gap:10px;pointer-events:auto}
.ctrl-btn{width:70px;height:70px;border-radius:16px;background:rgba(160,107,255,.15);
  border:2px solid rgba(160,107,255,.4);backdrop-filter:blur(10px);
  display:flex;justify-content:center;align-items:center;font-size:24px;font-weight:900;
  cursor:pointer;transition:transform .1s}
.ctrl-btn:active{transform:scale(.9);background:rgba(160,107,255,.4)}
.ctrl-btn.gas{background:rgba(91,255,157,.15);border-color:rgba(91,255,157,.4)}
.ctrl-btn.gas:active{background:rgba(91,255,157,.4)}
.ctrl-btn.brake{background:rgba(255,91,127,.15);border-color:rgba(255,91,127,.4)}
.ctrl-btn.brake:active{background:rgba(255,91,127,.4)}

.overlay{position:absolute;inset:0;background:rgba(10,10,26,.92);backdrop-filter:blur(20px);
  display:none;flex-direction:column;justify-content:center;align-items:center;padding:30px;
  z-index:10;text-align:center;animation:fadeIn .4s ease}
.overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.overlay h1{font-size:36px;margin-bottom:12px;font-weight:900;
  background:linear-gradient(90deg,#5be3ff,#5bff9d);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(91,227,255,.5))}
.overlay h1.dead{background:linear-gradient(90deg,#ff5b7f,#ffd86b);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,91,127,.5))}
.overlay .big{font-size:52px;font-weight:900;color:#ffd86b;margin:16px 0;
  filter:drop-shadow(0 0 20px rgba(255,216,107,.6))}
.overlay p{color:#9aa0c0;font-size:14px;line-height:1.6;max-width:340px;margin-bottom:8px}
.overlay button{margin-top:24px;padding:16px 48px;border:none;border-radius:16px;
  font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;letter-spacing:1px;
  background:linear-gradient(135deg,#5be3ff,#5bff9d);color:#001;transition:.2s;
  box-shadow:0 10px 30px rgba(91,227,255,.4)}
.overlay button:hover{filter:brightness(1.15);transform:translateY(-2px) scale(1.03);
  box-shadow:0 15px 40px rgba(91,227,255,.6)}

#startScreen{position:absolute;inset:0;background:rgba(10,10,26,.96);backdrop-filter:blur(20px);
  display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;
  z-index:20;text-align:center}
#startScreen.hidden{display:none}
#startScreen h1{font-size:52px;margin-bottom:8px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(90deg,#5be3ff,#5bff9d,#ffd86b);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 30px rgba(91,227,255,.5))}
#startScreen .sub{color:#9aa0c0;font-size:13px;letter-spacing:6px;margin-bottom:30px;font-weight:700}
#startScreen .rules{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);
  border-radius:16px;padding:20px;max-width:340px;margin-bottom:24px;text-align:left;
  font-size:13px;color:#9aa0c0;line-height:2;backdrop-filter:blur(10px)}
#startScreen .rules b{color:#5be3ff;font-weight:800}
#startScreen button{padding:18px 52px;border:none;border-radius:16px;
  font-size:18px;font-weight:900;font-family:inherit;cursor:pointer;letter-spacing:1px;
  background:linear-gradient(135deg,#5be3ff,#5bff9d);color:#001;transition:.2s;
  box-shadow:0 10px 30px rgba(91,227,255,.4)}
#startScreen button:hover{filter:brightness(1.15);transform:translateY(-2px) scale(1.03);
  box-shadow:0 15px 40px rgba(91,227,255,.6)}

#shopScreen{position:absolute;inset:0;background:rgba(10,10,26,.95);backdrop-filter:blur(20px);
  display:none;flex-direction:column;justify-content:center;align-items:center;padding:30px;
  z-index:50;text-align:center}
#shopScreen.show{display:flex}
#shopScreen h1{color:#a06bff;font-size:32px;margin-bottom:10px;
  filter:drop-shadow(0 0 15px rgba(160,107,255,.5))}
#shopScreen p{margin-bottom:20px;font-size:16px}
#shopScreen p b{color:#ffd86b}
#shopList{width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;
  margin-bottom:20px;max-height:60vh;overflow-y:auto;padding:5px}
.shop-item{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;padding:14px;display:flex;align-items:center;gap:14px;text-align:left;
  transition:0.2s}
.shop-item:hover{border-color:rgba(160,107,255,0.5);background:rgba(160,107,255,0.1)}
.shop-item .icon{font-size:24px;width:48px;height:48px;display:flex;justify-content:center;
  align-items:center;background:rgba(160,107,255,0.15);border-radius:12px}
.shop-item .info{flex:1}
.shop-item .name{font-size:14px;font-weight:800;color:#fff}
.shop-item .lvl{color:#5be3ff;font-size:12px;font-weight:700}
.shop-item .desc{font-size:11px;color:#9aa0c0;margin-top:2px}
.shop-item button{padding:10px 16px;border:none;border-radius:10px;font-size:12px;
  font-weight:800;cursor:pointer;transition:0.2s}
.shop-item button:hover:not(:disabled){filter:brightness(1.2)}
.shop-item button:disabled{background:rgba(255,255,255,0.05) !important;color:#555 !important;
  cursor:not-allowed}
#shopScreen .close-btn{margin-top:10px;padding:16px 44px;border:none;border-radius:14px;font-size:16px;
  font-weight:900;background:linear-gradient(135deg,#5be3ff,#5bff9d);color:#001;cursor:pointer;
  transition:0.2s}
#shopScreen .close-btn:hover{filter:brightness(1.15);transform:scale(1.03)}
</style>
</head>
<body>

<div id="game">
  <canvas id="cv"></canvas>

  <div class="hud">
    <div class="hud-box speed"><div class="label">СКОРОСТЬ</div><div class="value" id="hSpeed">0</div></div>
    <div class="hud-box coins"><div class="label">МОНЕТЫ</div><div class="value" id="hCoins">0</div></div>
    <div class="hud-box score"><div class="label">СЧЁТ</div><div class="value" id="hScore">0</div></div>
  </div>

  <div class="mobile-controls">
    <div class="group">
      <div class="ctrl-btn" id="btnLeft">◀</div>
      <div class="ctrl-btn" id="btnRight">▶</div>
    </div>
    <div class="group">
      <div class="ctrl-btn brake" id="btnBrake">▼</div>
      <div class="ctrl-btn gas" id="btnGas">▲</div>
    </div>
  </div>

  <div id="startScreen">
    <h1>TOP RACER</h1>
    <div class="sub">ГОНОЧНАЯ АРКАДА</div>
    <div class="rules">
      🎮 <b>Управление:</b> A / D (руль)<br>
      ⚡ <b>Газ / Тормоз:</b> W / S<br>
      💰 <b>Цель:</b> собирай монеты, качай тачку<br>
      🛒 <b>Магазин:</b> клавиша B или кнопка
    </div>
    <button onclick="startGame()">ИГРАТЬ</button>
  </div>

  <div class="overlay" id="deathScreen">
    <h1 class="dead">💥 АВАРИЯ</h1>
    <div class="big" id="finalScore">0</div>
    <p>метров проехано</p>
    <p style="font-size:12px;color:#666">Рекорд: <b id="bestScore">0</b></p>
    <button onclick="restartGame()">ЕЩЁ РАЗ</button>
  </div>

  <div id="shopScreen">
    <h1>🛒 ГАРАЖ</h1>
    <p>Золото: <b id="shopGold">0</b> 🪙</p>
    <div id="shopList"></div>
    <button class="close-btn" onclick="toggleShop()">ЗАКРЫТЬ</button>
  </div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H;

const state = {
  running: false, paused: false,
  speed: 0, targetSpeed: 0,
  coins: 0, score: 0, best: 0,
  playerX: 0, playerTargetX: 0,
  obstacles: [], coinDrops: [], roadOffset: 0,
  keys: { left: false, right: false, up: false, down: false },
  upgrades: { engine: 0, handling: 0, magnet: 0 },
  shopOpen: false, crashTimer: 0, particles: [],
  spawnTimer: 0
};

const UPG = {
  engine: { name: 'Двигатель', icon: '⚙️', max: 10, base: 50, mult: 1.5, desc: '+10% макс. скорости' },
  handling: { name: 'Управление', icon: '🎮', max: 10, base: 40, mult: 1.5, desc: '+10% отзывчивости' },
  magnet: { name: 'Магнит', icon: '🧲', max: 5, base: 80, mult: 1.8, desc: '+20% радиус сбора' }
};

// --- ОТПРАВКА В ХАБ ---
function sendToHub(type, data) {
  if (window.parent !== window) {
    window.parent.postMessage({ type: type, game: 'racer', ...data }, '*');
  }
}

function resize() {
  W = cv.width = cv.parentElement.clientWidth;
  H = cv.height = cv.parentElement.clientHeight;
}
window.addEventListener('resize', resize);
resize();

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('deathScreen').classList.remove('show');
  initGame();
  state.running = true;
}

function restartGame() { startGame(); }

function initGame() {
  state.speed = 0; state.targetSpeed = 0;
  state.coins = 0; state.score = 0;
  state.playerX = W / 2; state.playerTargetX = W / 2;
  state.obstacles = []; state.coinDrops = []; state.roadOffset = 0;
  state.paused = false; state.crashTimer = 0; state.particles = [];
  state.spawnTimer = 1;
  updateHUD();
}

function updateHUD() {
  document.getElementById('hCoins').textContent = state.coins;
  document.getElementById('hScore').textContent = Math.floor(state.score);
}

// Управление
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a' || k === 'ф') state.keys.left = true;
  if (k === 'arrowright' || k === 'd' || k === 'в') state.keys.right = true;
  if (k === 'arrowup' || k === 'w' || k === 'ц') state.keys.up = true;
  if (k === 'arrowdown' || k === 's' || k === 'ы') state.keys.down = true;
  if (k === 'b' || k === 'и') toggleShop();
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a' || k === 'ф') state.keys.left = false;
  if (k === 'arrowright' || k === 'd' || k === 'в') state.keys.right = false;
  if (k === 'arrowup' || k === 'w' || k === 'ц') state.keys.up = false;
  if (k === 'arrowdown' || k === 's' || k === 'ы') state.keys.down = false;
});

const bindBtn = (id, key) => {
  const btn = document.getElementById(id);
  btn.addEventListener('pointerdown', e => { e.preventDefault(); state.keys[key] = true; });
  btn.addEventListener('pointerup', e => { e.preventDefault(); state.keys[key] = false; });
  btn.addEventListener('pointerleave', () => state.keys[key] = false);
  btn.addEventListener('pointercancel', () => state.keys[key] = false);
};
bindBtn('btnLeft', 'left'); bindBtn('btnRight', 'right');
bindBtn('btnGas', 'up'); bindBtn('btnBrake', 'down');

function toggleShop() {
  if (!state.running) return;
  state.paused = !state.paused;
  state.shopOpen = state.paused;
  const shop = document.getElementById('shopScreen');
  if (state.paused) { shop.classList.add('show'); updateShopUI(); }
  else shop.classList.remove('show');
}

function updateShopUI() {
  document.getElementById('shopGold').innerText = state.coins;
  const list = document.getElementById('shopList');
  list.innerHTML = '';
  for (const key in UPG) {
    const item = UPG[key];
    const lvl = state.upgrades[key];
    const cost = Math.floor(item.base * Math.pow(item.mult, lvl));
    const canBuy = state.coins >= cost && lvl < item.max;
    const div = document.createElement('div');
    div.className = 'shop-item';
    div.innerHTML = `
      <div class="icon">${item.icon}</div>
      <div class="info">
        <div class="name">${item.name} <span class="lvl">Ур. ${lvl}/${item.max}</span></div>
        <div class="desc">${item.desc}</div>
      </div>
      <button ${canBuy ? '' : 'disabled'} style="background:${canBuy ? '#a06bff' : 'rgba(255,255,255,0.05)'}; color:${canBuy ? '#fff' : '#555'};">
        ${lvl >= item.max ? 'MAX' : cost + ' 🪙'}
      </button>
    `;
    div.querySelector('button').onclick = () => {
      if (canBuy) { state.coins -= cost; state.upgrades[key]++; updateShopUI(); updateHUD(); }
    };
    list.appendChild(div);
  }
}

function update(dt) {
  if (!state.running || state.paused) return;
  if (state.crashTimer > 0) {
    state.crashTimer -= dt;
    if (state.crashTimer <= 0) gameOver();
    return;
  }

  let steer = 0;
  if (state.keys.left) steer -= 1;
  if (state.keys.right) steer += 1;
  const handling = 1 + state.upgrades.handling * 0.1;
  state.playerTargetX += steer * 450 * handling * dt;
  state.playerX += (state.playerTargetX - state.playerX) * Math.min(1, dt * 12 * handling);
  
  const roadW = W * 0.65;
  const minX = W/2 - roadW/2 + 25;
  const maxX = W/2 + roadW/2 - 25;
  state.playerX = Math.max(minX, Math.min(maxX, state.playerX));
  state.playerTargetX = Math.max(minX, Math.min(maxX, state.playerTargetX));

  const maxSpeed = 500 + state.upgrades.engine * 60;
  if (state.keys.up) state.targetSpeed = maxSpeed;
  else if (state.keys.down) state.targetSpeed = 150;
  else state.targetSpeed = 350;
  
  const accel = state.targetSpeed > state.speed ? 250 : 400;
  if (state.speed < state.targetSpeed) state.speed = Math.min(state.targetSpeed, state.speed + accel * dt);
  else if (state.speed > state.targetSpeed) state.speed = Math.max(state.targetSpeed, state.speed - accel * dt);
  
  const scrollSpeed = state.speed * dt;
  state.roadOffset = (state.roadOffset + scrollSpeed) % 40;
  state.score += scrollSpeed * 0.05;

  if (state.speed > 400 && Math.random() < 0.5) {
    state.particles.push({
      x: state.playerX + (Math.random() - 0.5) * 20, y: H - 90,
      vx: (Math.random() - 0.5) * 50, vy: 100 + Math.random() * 100,
      life: 0.4, color: '#5be3ff'
    });
  }

  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    state.spawnTimer = 0.8 + Math.random() * 1.2;
    const lane = Math.floor(Math.random() * 3);
    const laneWidth = (roadW - 60) / 3;
    const baseX = W/2 - (roadW - 60)/2 + lane * laneWidth + laneWidth/2;
    
    if (Math.random() < 0.4) {
      state.obstacles.push({
        x: baseX, y: -100, w: 44, h: 76,
        type: Math.random() < 0.3 ? 'truck' : 'car',
        speed: 200 + Math.random() * 300,
        color: ['#ff5b7f','#ff9a5b','#ffd86b','#5bff9d','#5be3ff','#a06bff'][Math.floor(Math.random()*6)]
      });
    }
    if (Math.random() < 0.8) {
      state.coinDrops.push({
        x: baseX + (Math.random() - 0.5) * 30,
        y: -100 - Math.random() * 100, r: 12
      });
    }
  }

  for (let i = state.obstacles.length - 1; i >= 0; i--) {
    const o = state.obstacles[i];
    o.y += (state.speed - o.speed) * dt; 
    if (o.y > H + 100 || o.y < -200) { state.obstacles.splice(i, 1); continue; }
    
    if (Math.abs(state.playerX - (o.x + o.w/2)) < 35 && Math.abs((H - 120) - (o.y + o.h/2)) < 50) {
      state.crashTimer = 1.5; state.speed = 0; state.targetSpeed = 0;
      for (let j = 0; j < 25; j++) {
        state.particles.push({
          x: state.playerX, y: H - 100, vx: (Math.random() - 0.5) * 400, vy: (Math.random() - 0.5) * 400,
          life: 0.8, color: Math.random() < 0.5 ? '#ff5b7f' : '#ffd86b'
        });
      }
    }
  }

  const magnetRange = 60 + state.upgrades.magnet * 40;
  for (let i = state.coinDrops.length - 1; i >= 0; i--) {
    const c = state.coinDrops[i];
    c.y += state.speed * dt;
    const dx = state.playerX - c.x, dy = (H - 120) - c.y;
    const dist = Math.hypot(dx, dy);
    if (dist < magnetRange && state.speed > 0) { c.x += (dx / dist) * 600 * dt; c.y += (dy / dist) * 600 * dt; }
    if (dist < 30) { state.coins++; updateHUD(); state.coinDrops.splice(i, 1); continue; }
    if (c.y > H + 100) state.coinDrops.splice(i, 1);
  }

  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) state.particles.splice(i, 1);
  }

  document.getElementById('hSpeed').textContent = Math.floor(state.speed / 5) + ' км/ч';
}

function gameOver() {
  state.running = false;
  
  // ОТПРАВЛЯЕМ РЕКОРД В ХАБ
  sendToHub('score', { score: Math.floor(state.score) });
  if (state.score >= 1000) sendToHub('achievement', { id: 'racer_1000' });

  const best = localStorage.getItem('best_racer') || 0;
  document.getElementById('finalScore').textContent = Math.floor(state.score);
  document.getElementById('bestScore').textContent = Math.max(Math.floor(state.score), best);
  document.getElementById('deathScreen').classList.add('show');
}

function draw() {
  ctx.fillStyle = '#0f171e';
  ctx.fillRect(0, 0, W, H);

  const roadW = W * 0.65;
  const roadX = W/2 - roadW/2;

  const roadGrd = ctx.createLinearGradient(roadX, 0, roadX + roadW, 0);
  roadGrd.addColorStop(0, '#1a1a2e'); roadGrd.addColorStop(0.5, '#2a2a3e'); roadGrd.addColorStop(1, '#1a1a2e');
  ctx.fillStyle = roadGrd; ctx.fillRect(roadX, 0, roadW, H);

  ctx.fillStyle = '#5be3ff'; ctx.shadowBlur = 15; ctx.shadowColor = '#5be3ff';
  ctx.fillRect(roadX, 0, 4, H); ctx.fillRect(roadX + roadW - 4, 0, 4, H); ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  for (let y = -40 + state.roadOffset; y < H; y += 40) {
    ctx.fillRect(W/2 - 2, y, 4, 20);
    ctx.fillRect(roadX + roadW/4 - 2, y, 2, 15);
    ctx.fillRect(roadX + roadW*0.75 - 2, y, 2, 15);
  }

  state.particles.forEach(p => {
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  state.coinDrops.forEach(c => {
    ctx.shadowBlur = 15; ctx.shadowColor = '#ffd86b'; ctx.fillStyle = '#ffd86b';
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#000'; ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('$', c.x, c.y + 1);
  });

  state.obstacles.forEach(o => {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.roundRect(o.x + 4, o.y + 4, o.w, o.h, 8); ctx.fill();
    ctx.fillStyle = o.color || '#ff5b7f';
    ctx.beginPath(); ctx.roundRect(o.x, o.y, o.w, o.h, 8); ctx.fill();
    ctx.fillStyle = 'rgba(91,227,255,.8)';
    ctx.beginPath(); ctx.roundRect(o.x + 6, o.y + 10, o.w - 12, 15, 4); ctx.fill();
    ctx.beginPath(); ctx.roundRect(o.x + 6, o.y + o.h - 25, o.w - 12, 15, 4); ctx.fill();
  });

  const px = state.playerX, py = H - 120;
  ctx.shadowBlur = 30; ctx.shadowColor = '#5be3ff';
  ctx.fillStyle = 'rgba(91,227,255,0.2)';
  ctx.beginPath(); ctx.ellipse(px, py + 20, 30, 15, 0, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  const carGrd = ctx.createLinearGradient(px - 20, py - 35, px + 20, py + 35);
  carGrd.addColorStop(0, '#5be3ff'); carGrd.addColorStop(1, '#5bff9d');
  ctx.fillStyle = carGrd;
  ctx.beginPath(); ctx.roundRect(px - 20, py - 35, 40, 70, 10); ctx.fill();
  
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.beginPath(); ctx.roundRect(px - 14, py - 25, 28, 18, 5); ctx.fill();
  ctx.beginPath(); ctx.roundRect(px - 14, py + 12, 28, 14, 5); ctx.fill();
  
  ctx.fillStyle = '#fff'; ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
  ctx.fillRect(px - 16, py - 35, 10, 4); ctx.fillRect(px + 6, py - 35, 10, 4); ctx.shadowBlur = 0;

  if (state.crashTimer > 0) {
    ctx.fillStyle = `rgba(255,91,127,${0.3 + Math.sin(Date.now() / 50) * 0.2})`;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('💥 АВАРИЯ', W/2, H/2);
  }
}

let lastTime = performance.now();
function loop(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.05);
  lastTime = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
</script>
</body>
