<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Hub</title>
<style>
:root {
  --bg: #0a0a1a; --text: #fff; --text-muted: #9aa0c0;
  --card-bg: rgba(255,255,255,.08); --card-border: rgba(255,255,255,.12);
  --accent: #a06bff; --accent-hover: #6b3fcf;
  --grad: linear-gradient(90deg,#a06bff,#5be3ff,#ffd86b);
}
[data-theme="light"] {
  --bg: #f0f2f5; --text: #1a1a2e; --text-muted: #5a6070;
  --card-bg: #ffffff; --card-border: rgba(0,0,0,.08);
  --accent: #6b3fcf; --accent-hover: #5a2eb5;
  --grad: linear-gradient(90deg,#6b3fcf,#0099cc,#cc8800);
}
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }
body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; transition:background .3s, color .3s; overflow-x:hidden; }
body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:-1; opacity:0.15;
  background:radial-gradient(circle at 20% 10%,#a06bff,transparent 45%), radial-gradient(circle at 80% 30%,#5be3ff,transparent 45%), radial-gradient(circle at 50% 90%,#ffd86b,transparent 50%); }

/* Шапка */
.header { display:flex; justify-content:space-between; align-items:center; padding:20px 30px; }
.logo { font-size:32px; font-weight:900; letter-spacing:2px; background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.header-btns { display:flex; gap:10px; }
.icon-btn { width:44px; height:44px; border-radius:12px; border:1px solid var(--card-border); background:var(--card-bg); color:var(--text); font-size:20px; cursor:pointer; display:flex; justify-content:center; align-items:center; transition:.2s; }
.icon-btn:hover { background:var(--accent); color:#fff; }

/* Профиль */
.profile-bar { max-width:1000px; margin:0 auto 20px; background:var(--card-bg); border:1px solid var(--card-border); border-radius:20px; padding:16px 24px; display:flex; align-items:center; gap:20px; }
.avatar { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg,#5be3ff,#a06bff); display:flex; justify-content:center; align-items:center; font-size:32px; box-shadow:0 0 20px rgba(160,107,255,.5); cursor:pointer; transition:0.2s; position:relative; }
.avatar:hover { transform:scale(1.05); }
.avatar::after { content:'✎'; position:absolute; bottom:0; right:0; background:var(--bg); font-size:14px; width:20px; height:20px; border-radius:50%; display:flex; justify-content:center; align-items:center; border:1px solid var(--accent); }
.profile-info { flex:1; }
.profile-name { font-size:20px; font-weight:800; display:flex; align-items:center; gap:10px; }
.edit-name { font-size:14px; cursor:pointer; opacity:0.5; }
.edit-name:hover { opacity:1; }
.lvl-row { display:flex; align-items:center; gap:12px; margin-top:8px; }
.lvl-badge { background:var(--accent); color:#fff; padding:2px 10px; border-radius:8px; font-size:12px; font-weight:800; }
.xp-bar { flex:1; height:8px; background:rgba(0,0,0,.2); border-radius:4px; overflow:hidden; }
.xp-fill { height:100%; background:linear-gradient(90deg,#5be3ff,#5bff9d); transition:width .3s; }

/* Поиск и категории */
.filters-section { max-width:1000px; margin:0 auto 20px; display:flex; flex-direction:column; gap:15px; padding:0 20px; }
.search-box { width:100%; position:relative; }
.search-box input { width:100%; padding:16px 24px; border-radius:16px; border:1px solid var(--card-border); background:var(--card-bg); color:var(--text); font-size:16px; font-family:inherit; outline:none; transition:.2s; }
.search-box input:focus { border-color:var(--accent); box-shadow:0 0 15px rgba(160,107,255,.3); }
.search-box input::placeholder { color:var(--text-muted); }

.category-tabs { display:flex; gap:10px; overflow-x:auto; padding-bottom:5px; scrollbar-width:none; }
.category-tabs::-webkit-scrollbar { display:none; }
.cat-btn { padding:8px 20px; border-radius:20px; background:var(--card-bg); border:1px solid var(--card-border); color:var(--text-muted); font-weight:700; cursor:pointer; transition:.2s; white-space:nowrap; font-size:14px; }
.cat-btn:hover { border-color:var(--accent); color:var(--text); }
.cat-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 5px 15px rgba(160,107,255,.4); }

/* Сетка игр */
.game-list { display:grid; grid-template-columns:1fr; gap:20px; max-width:1000px; margin:0 auto; padding:0 20px 40px; }
@media(min-width:768px) { .game-list { grid-template-columns:1fr 1fr; } }
@media(min-width:1100px) { .game-list { grid-template-columns:1fr 1fr 1fr; } }

.game-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:24px; padding:24px; cursor:pointer; transition:.3s; position:relative; text-align:center; text-decoration:none; color:var(--text); display:block; }
.game-card:hover { transform:translateY(-6px); border-color:var(--accent); box-shadow:0 20px 60px rgba(160,107,255,.2); }
.game-card .emoji { font-size:60px; margin-bottom:12px; display:block; transition:.3s; }
.game-card:hover .emoji { transform:scale(1.1) rotate(-5deg); }
.game-card .title { font-size:20px; font-weight:800; margin-bottom:6px; }
.game-card .desc { font-size:12px; color:var(--text-muted); line-height:1.5; margin-bottom:16px; height:36px; }
.game-card .play-btn { display:inline-block; padding:10px 28px; border-radius:12px; background:var(--accent); color:#fff; font-weight:800; font-size:14px; transition:.2s; }
.game-card:hover .play-btn { background:var(--accent-hover); transform:scale(1.05); }
.game-card .tag { position:absolute; top:16px; right:16px; font-size:10px; padding:4px 10px; border-radius:8px; font-weight:700; letter-spacing:1px; background:rgba(0,0,0,.2); }
.game-card .high-score { position:absolute; bottom:16px; left:16px; font-size:11px; color:var(--text-muted); }

/* Модалки */
.modal { position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; justify-content:center; align-items:center; z-index:100; backdrop-filter:blur(5px); }
.modal.show { display:flex; }
.modal-box { background:var(--bg); border:1px solid var(--accent); border-radius:20px; padding:24px; max-width:400px; width:90%; max-height:80vh; overflow-y:auto; text-align:center; }
.modal-box h2 { margin-bottom:16px; color:var(--accent); }
.modal-box input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--card-border); background:var(--card-bg); color:var(--text); font-size:16px; margin-bottom:12px; font-family:inherit; }
.modal-box button { width:100%; padding:12px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-weight:800; font-size:15px; cursor:pointer; margin-top:8px; }
.modal-box button:hover { background:var(--accent-hover); }

/* Сетка аватарок */
.avatar-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-bottom:10px; }
.avatar-item { font-size:32px; width:60px; height:60px; display:flex; justify-content:center; align-items:center; background:var(--card-bg); border:1px solid var(--card-border); border-radius:12px; cursor:pointer; transition:.2s; margin:0 auto; }
.avatar-item:hover { border-color:var(--accent); transform:scale(1.1); }
.avatar-item.active { background:rgba(160,107,255,0.2); border-color:var(--accent); }

/* Достижения и Лидеры */
.ach-list { display:flex; flex-direction:column; gap:10px; }
.ach-item { display:flex; align-items:center; gap:12px; padding:10px; border-radius:12px; background:var(--card-bg); border:1px solid var(--card-border); opacity:0.5; }
.ach-item.unlocked { opacity:1; border-color:#5bff9d; box-shadow:0 0 15px rgba(91,255,157,.2); }
.ach-icon { font-size:28px; width:44px; height:44px; display:flex; justify-content:center; align-items:center; background:rgba(0,0,0,.2); border-radius:10px; }
.ach-info { flex:1; text-align:left; }
.ach-name { font-weight:800; font-size:14px; }
.ach-desc { font-size:11px; color:var(--text-muted); }
.leaderboard { display:flex; flex-direction:column; gap:6px; }
.lb-row { display:flex; justify-content:space-between; padding:10px 14px; background:var(--card-bg); border-radius:10px; font-size:14px; }
.lb-row:nth-child(1) { border-left:4px solid #ffd86b; }
.lb-row:nth-child(2) { border-left:4px solid #c0c0c0; }
.lb-row:nth-child(3) { border-left:4px solid #cd7f32; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">GAME HUB</div>
  <div class="header-btns">
    <div class="icon-btn" onclick="toggleTheme()" title="Тема">🌗</div>
    <div class="icon-btn" onclick="openModal('modalAch')" title="Достижения">🏅</div>
    <div class="icon-btn" onclick="openModal('modalLb')" title="Рекорды">🏆</div>
  </div>
</div>

<div class="profile-bar">
  <div class="avatar" id="avatar" onclick="openModal('modalAvatar')" title="Сменить аватар">👤</div>
  <div class="profile-info">
    <div class="profile-name">
      <span id="pName">Игрок</span>
      <span class="edit-name" onclick="editName()">✏️</span>
    </div>
    <div class="lvl-row">
      <span class="lvl-badge" id="pLvl">Ур. 1</span>
      <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
      <span style="font-size:11px; color:var(--text-muted)" id="xpText">0 / 100</span>
    </div>
  </div>
</div>

<div class="filters-section">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Поиск игры по названию или описанию...">
  </div>
  <div class="category-tabs" id="categoryTabs">
  </div>
</div>

<div class="game-list" id="gameList"></div>

<div class="modal" id="modalAvatar">
  <div class="modal-box">
    <h2>Выбери аватар</h2>
    <div class="avatar-grid" id="avatarGrid">
    </div>
    <button onclick="closeModal('modalAvatar')">Закрыть</button>
  </div>
</div>

<div class="modal" id="modalAch">
  <div class="modal-box">
    <h2>🏅 Достижения</h2>
    <div class="ach-list" id="achList"></div>
    <button onclick="closeModal('modalAch')">Закрыть</button>
  </div>
</div>

<div class="modal" id="modalLb">
  <div class="modal-box">
    <h2>🏆 Таблица лидеров</h2>
    <div class="leaderboard" id="lbList"></div>
    <button onclick="closeModal('modalLb')">Закрыть</button>
  </div>
</div>

<script>
const GAMES = [
  { id: 'tap', file: 'tap.html', title: 'Кликер', emoji: '💎', category: 'tycoon', tag: 'TAP', desc: 'Тапай монету и качай улучшения.' },
  { id: 'drift', file: 'drift.html', title: 'Дрифт', emoji: '🏎️', category: 'race', tag: 'RACE', desc: 'Дрифтуй и качай машины.' },
  { id: 'defense', file: 'defense.html', title: 'Защита базы', emoji: '🛡️', category: 'strategy', tag: 'TOWER', desc: 'Защищай базу от волн врагов.' },
  { id: 'arkanoid', file: 'arkanoid.html', title: 'Разбей кирпич', emoji: '🧱', category: 'arcade', tag: 'ARCADE', desc: 'Разбивай кирпичи и лови бонусы.' },
  { id: 'zombie', file: 'zombie.html', title: 'Зомби Шутер', emoji: '🧟', category: 'shooter', tag: 'SURVIVE', desc: 'Отбивайся от зомби и качай оружие.' },
  { id: 'blockblast', file: 'blockblast.html', title: 'Block Blast', emoji: '🧩', category: 'puzzle', tag: 'PUZZLE', desc: 'Расставляй блоки и зачищай линии.' },
  { id: 'racer', file: 'racer.html', title: 'Гонки', emoji: '🚗', category: 'race', tag: 'RACING', desc: 'Гонки сверху вниз с монетами.' },
  { id: 'gibdd', file: 'gibdd.html', title: 'ГИБДД Рулетка', emoji: '🚓', category: 'casino', tag: 'LUCK', desc: 'Крути номера, собирай блатные и качай удачу.' },
  { id: 'slots', file: 'slots.html', title: 'Казик 777', emoji: '🎰', category: 'casino', tag: 'CASINO', desc: 'Крути барабаны, лови джекпот и умножай баланс.' },
  { id: 'rogue', file: 'rogue.html', title: 'Исследуй подземелье', emoji: '🗡️', category: 'rpg', tag: 'ROGUELIKE', desc: 'Сражайся с монстрами и ищи сокровища.' },
  { id: 'geo', file: 'geo.html', title: 'Тест на знание Европы и Азии', emoji: '🌍', category: 'quiz', tag: 'QUIZ', desc: 'Проверь свои знания географии.' },
  { id: 'pong', file: 'pong.html', title: 'Пинг-Понг', emoji: '🏓', category: 'arcade', tag: 'PONG', desc: 'Классический пинг-понг против ИИ.' },
  { id: 'checkers', file: 'checkers.html', title: 'Шашки', emoji: '⚫', category: 'board', tag: 'BOARD', desc: 'Классические шашки против ИИ или друга.' },
  { id: 'runner3d', file: 'runner3d.html', title: 'Неоновый Раннер 3D', emoji: '🏃', category: 'arcade', tag: '3D', desc: 'Беги по неоновому туннелю, уворачивайся и собирай монеты.' }
];

const CATEGORIES = [
  { id: 'all', name: 'Все игры' },
  { id: 'arcade', name: 'Аркады' },
  { id: 'puzzle', name: 'Головоломки' },
  { id: 'shooter', name: 'Шутеры' },
  { id: 'race', name: 'Гонки' },
  { id: 'casino', name: 'Казино' },
  { id: 'strategy', name: 'Стратегии' },
  { id: 'rpg', name: 'Рогалики' },
  { id: 'tycoon', name: 'Кликеры' },
  { id: 'quiz', name: 'Викторины' },
  { id: 'board', name: 'Настольные' }
];

const AVAILABLE_AVATARS = ['👤', '🐱', '🐶', '🦊', '🐼', '🐸', '👽', '🤖', '👻', '😎', '🧙‍♂️', '🦸‍♂️', '🦹‍♂️', '🥷', '💀', '🎃'];

let profile = JSON.parse(localStorage.getItem('hub_profile')) || {
  name: 'Игрок', xp: 0, lvl: 1, theme: 'dark', achievements: [], avatar: '👤'
};
if (!profile.avatar) profile.avatar = '👤';

let currentCategory = 'all';
let searchQuery = '';

const ALL_ACH = [
  { id: 'first_step', name: 'Первый шаг', desc: 'Запустить любую игру', icon: '👣' },
  { id: 'tap_100', name: 'Тапальщик', desc: 'Сделать 100 тапов в Кликере', icon: '👆' },
  { id: 'tap_1000', name: 'Мастер тапа', desc: 'Сделать 1000 тапов', icon: '💎' },
  { id: 'zombie_50', name: 'Истребитель', desc: 'Убить 50 зомби', icon: '🧟' },
  { id: 'zombie_500', name: 'Чистильщик', desc: 'Убить 500 зомби', icon: '💀' },
  { id: 'racer_1000', name: 'Гонщик', desc: 'Проехать 1000 метров в Гонках', icon: '🏁' }
];

function initCategoryTabs() {
  const container = document.getElementById('categoryTabs');
  container.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (currentCategory === cat.id ? ' active' : '');
    btn.textContent = cat.name;
    btn.onclick = () => {
      currentCategory = cat.id;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGames();
    };
    container.appendChild(btn);
  });
}

function initAvatarModal() {
  const grid = document.getElementById('avatarGrid');
  grid.innerHTML = '';
  AVAILABLE_AVATARS.forEach(av => {
    const item = document.createElement('div');
    item.className = 'avatar-item' + (profile.avatar === av ? ' active' : '');
    item.textContent = av;
    item.onclick = () => {
      profile.avatar = av;
      saveProfile();
      updateUI();
      closeModal('modalAvatar');
    };
    grid.appendChild(item);
  });
}

function renderGames() {
  const list = document.getElementById('gameList');
  list.innerHTML = '';
  
  const filtered = GAMES.filter(g => {
    const matchCat = currentCategory === 'all' || g.category === currentCategory;
    const matchSearch = g.title.toLowerCase().includes(searchQuery) || g.desc.toLowerCase().includes(searchQuery);
    return matchCat && matchSearch;
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:var(--text-muted); padding:40px;">Игры не найдены 😢</div>';
    return;
  }

  filtered.forEach(g => {
    const best = localStorage.getItem('best_' + g.id) || 0;
    const card = document.createElement('a');
    card.href = g.file;
    card.target = '_blank';
    card.className = 'game-card';
    card.onclick = () => { unlockAch('first_step'); };
    card.innerHTML = `
      <span class="tag">${g.tag}</span>
      <span class="emoji">${g.emoji}</span>
      <div class="title">${g.title}</div>
      <div class="desc">${g.desc}</div>
      <span class="play-btn">▶ Играть</span>
      ${best > 0 ? `<div class="high-score">Рекорд: ${best}</div>` : ''}
    `;
    list.appendChild(card);
  });
}

function updateUI() {
  document.documentElement.setAttribute('data-theme', profile.theme);
  document.getElementById('avatar').textContent = profile.avatar;
  document.getElementById('pName').textContent = profile.name;
  document.getElementById('pLvl').textContent = 'Ур. ' + profile.lvl;
  
  const xpNeeded = profile.lvl * 100;
  const pct = Math.min(100, (profile.xp / xpNeeded) * 100);
  document.getElementById('xpFill').style.width = pct + '%';
  document.getElementById('xpText').textContent = profile.xp + ' / ' + xpNeeded;

  renderGames();
}

function unlockAch(id) {
  if (profile.achievements.includes(id)) return;
  profile.achievements.push(id);
  saveProfile();
  
  const ach = ALL_ACH.find(a => a.id === id);
  if (ach) {
    const toast = document.createElement('div');
    toast.style.cssText = `position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#5bff9d; color:#001; padding:16px 24px; border-radius:14px; font-weight:800; z-index:9999; box-shadow:0 10px 40px rgba(91,255,157,.5);`;
    toast.innerHTML = `🏅 Достижение: ${ach.name}!`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }
}

function renderAchievements() {
  const list = document.getElementById('achList');
  list.innerHTML = '';
  ALL_ACH.forEach(a => {
    const unlocked = profile.achievements.includes(a.id);
    const item = document.createElement('div');
    item.className = 'ach-item' + (unlocked ? ' unlocked' : '');
    item.innerHTML = `
      <div class="ach-icon">${unlocked ? a.icon : '🔒'}</div>
      <div class="ach-info">
        <div class="ach-name">${a.name}</div>
        <div class="ach-desc">${a.desc}</div>
      </div>
    `;
    list.appendChild(item);
  });
}

function renderLeaderboard() {
  const list = document.getElementById('lbList');
  list.innerHTML = '';
  
  GAMES.forEach(g => {
    const best = parseInt(localStorage.getItem('best_' + g.id) || 0);
    if (best > 0) {
      const row = document.createElement('div');
      row.className = 'lb-row';
      row.innerHTML = `<span>${g.emoji} ${g.title}</span><b>${best.toLocaleString('ru')}</b>`;
      list.appendChild(row);
    }
  });
  
  if (list.children.length === 0) {
    list.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:20px;">Пока нет рекордов. Сыграй в игру!</p>';
  }
}

function saveProfile() {
  localStorage.setItem('hub_profile', JSON.stringify(profile));
}

function editName() {
  const name = prompt('Введите ваше имя:', profile.name);
  if (name && name.trim()) {
    profile.name = name.trim().substring(0, 15);
    saveProfile();
    updateUI();
  }
}

function addXP(amount) {
  profile.xp += amount;
  while (profile.xp >= profile.lvl * 100) {
    profile.xp -= profile.lvl * 100;
    profile.lvl++;
    const toast = document.createElement('div');
    toast.style.cssText = `position:fixed; top:20px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#a06bff,#5be3ff); color:#fff; padding:16px 24px; border-radius:14px; font-weight:800; z-index:9999;`;
    toast.innerHTML = `🎉 Новый уровень: ${profile.lvl}!`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }
  saveProfile();
  updateUI();
}

function toggleTheme() {
  profile.theme = profile.theme === 'dark' ? 'light' : 'dark';
  saveProfile();
  updateUI();
}

function openModal(id) {
  document.getElementById(id).classList.add('show');
  if (id === 'modalAch') renderAchievements();
  if (id === 'modalLb') renderLeaderboard();
  if (id === 'modalAvatar') initAvatarModal();
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

window.HubAPI = {
  submitScore: function(gameId, score) {
    const current = parseInt(localStorage.getItem('best_' + gameId) || 0);
    if (score > current) {
      localStorage.setItem('best_' + gameId, score);
    }
    addXP(Math.min(50, Math.floor(score / 10)));
  },
  unlockAchievement: function(id) { unlockAch(id); },
  addXP: addXP
};

window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'score') {
    HubAPI.submitScore(e.data.game, e.data.score);
  }
  if (e.data && e.data.type === 'achievement') {
    unlockAch(e.data.id);
  }
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value.toLowerCase();
  renderGames();
});

initCategoryTabs();
updateUI();
</script>

</body>
