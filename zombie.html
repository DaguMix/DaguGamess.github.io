<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Zombie Shooter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0a1a;
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;
  display:flex;justify-content:center;align-items:center}
#game-container{position:relative;width:100%;max-width:1200px;height:100vh;display:flex;flex-direction:column;background:#0d0d1a}
canvas{flex:1;display:block;width:100%;height:100%;cursor:crosshair}

.hud{position:absolute;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;
  pointer-events:none;z-index:5;gap:12px;flex-wrap:wrap}
.hud-box{background:rgba(0,0,0,.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);
  border-radius:12px;padding:10px 20px;font-weight:800;text-align:center;min-width:100px}
.hud-box .label{font-size:11px;color:#9aa0c0;letter-spacing:1px;margin-bottom:4px}
.hud-box .value{font-size:22px;color:#5be3ff}
.hud-box.hp .value{color:#5bff9d}
.hud-box.gold .value{color:#ffd86b}
.hud-box.wave .value{color:#ff5b7f}
.hud-box.score .value{color:#a06bff}

.hp-bar{position:absolute;top:90px;left:20px;right:20px;height:10px;background:rgba(0,0,0,.5);
  border-radius:6px;overflow:hidden;z-index:5;pointer-events:none}
.hp-fill{height:100%;background:linear-gradient(90deg,#5bff9d,#5be3ff);transition:width .2s;width:100%}

.shop-btn{position:absolute;bottom:30px;right:30px;width:70px;height:70px;border-radius:50%;
  background:rgba(160,107,255,.3);border:2px solid #a06bff;backdrop-filter:blur(8px);
  display:flex;justify-content:center;align-items:center;font-size:32px;cursor:pointer;
  z-index:6;transition:.2s;box-shadow:0 0 20px rgba(160,107,255,.4)}
.shop-btn:hover{background:rgba(160,107,255,.5);transform:scale(1.1)}

.overlay{position:absolute;inset:0;background:rgba(10,10,26,.93);backdrop-filter:blur(10px);
  display:none;flex-direction:column;justify-content:center;align-items:center;padding:30px;
  z-index:10;text-align:center;overflow-y:auto}
.overlay.show{display:flex}
.overlay h1{font-size:40px;margin-bottom:16px;background:linear-gradient(90deg,#5be3ff,#5bff9d);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.overlay h1.dead{background:linear-gradient(90deg,#ff5b7f,#ffd86b);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.overlay .big{font-size:56px;font-weight:900;color:#ffd86b;margin:16px 0}
.overlay p{color:#9aa0c0;font-size:16px;line-height:1.6;max-width:400px;margin-bottom:12px}
.overlay button{margin-top:24px;padding:16px 48px;border:none;border-radius:14px;
  font-size:18px;font-weight:800;font-family:inherit;cursor:pointer;
  background:linear-gradient(135deg,#5be3ff,#5bff9d);color:#001;transition:.2s}
.overlay button:hover{filter:brightness(1.15);transform:scale(1.03)}

#startScreen{position:absolute;inset:0;background:rgba(10,10,26,.95);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;
  z-index:20;text-align:center}
#startScreen.hidden{display:none}
#startScreen h1{font-size:52px;margin-bottom:12px;
  background:linear-gradient(90deg,#5be3ff,#5bff9d,#ffd86b);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#startScreen .sub{color:#9aa0c0;font-size:14px;letter-spacing:4px;margin-bottom:30px}
#startScreen .rules{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:16px;padding:24px;max-width:400px;margin-bottom:24px;text-align:left;
  font-size:14px;color:#9aa0c0;line-height:1.8}
#startScreen .rules b{color:#5be3ff}
#startScreen button{padding:18px 56px;border:none;border-radius:16px;
  font-size:20px;font-weight:800;font-family:inherit;cursor:pointer;
  background:linear-gradient(135deg,#5be3ff,#5bff9d);color:#001;transition:.2s}
#startScreen button:hover{filter:brightness(1.15);transform:scale(1.03)}

#shopScreen{position:absolute;inset:0;background:rgba(10,10,26,.95);backdrop-filter:blur(10px);
  display:none;flex-direction:column;justify-content:center;align-items:center;padding:30px;
  z-index:50;text-align:center}
#shopScreen.show{display:flex}
#shopScreen h1{color:#a06bff;font-size:36px;margin-bottom:16px}
#shopScreen p{margin-bottom:24px;font-size:18px}
#shopScreen p b{color:#ffd86b}
#shopList{width:100%;max-width:500px;display:flex;flex-direction:column;gap:12px;
  margin-bottom:24px;max-height:60vh;overflow-y:auto;padding:5px}
.shop-item{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;padding:16px;display:flex;align-items:center;gap:16px;text-align:left;}
.shop-item .icon{font-size:28px;width:56px;height:56px;display:flex;justify-content:center;
  align-items:center;background:rgba(160,107,255,0.15);border-radius:12px}
.shop-item .info{flex:1}
.shop-item .name{font-size:16px;font-weight:800;color:#fff}
.shop-item .lvl{color:#5be3ff;font-size:13px;font-weight:700}
.shop-item .desc{font-size:12px;color:#9aa0c0;margin-top:4px}
.shop-item button{padding:12px 20px;border:none;border-radius:12px;font-size:14px;
  font-weight:800;cursor:pointer;transition:0.2s}
.shop-item button:disabled{background:rgba(255,255,255,0.05) !important;color:#555 !important;
  cursor:not-allowed}
#shopScreen .close-btn{margin-top:10px;padding:18px 56px;border:none;border-radius:16px;font-size:18px;
  font-weight:900;background:linear-gradient(135deg,#5be3ff,#5bff9d);color:#001;cursor:pointer;}
</style>
</head>
<body>

<div id="game-container">
  <canvas id="cv"></canvas>

  <div class="hud">
    <div class="hud-box hp"><div class="label">HP</div><div class="value" id="hHp">100</div></div>
    <div class="hud-box gold"><div class="label">ЗОЛОТО</div><div class="value" id="hGold">0</div></div>
    <div class="hud-box wave"><div class="label">ВОЛНА</div><div class="value" id="hWave">1</div></div>
    <div class="hud-box score"><div class="label">УБИЙСТВА</div><div class="value" id="hKills">0</div></div>
  </div>

  <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div>
  <div class="shop-btn" id="btnShop">🛒</div>

  <div id="startScreen">
    <h1>ZOMBIE SHOOTER</h1>
    <div class="sub">ВЫЖИВИ КАК МОЖНО ДОЛЬШЕ</div>
    <div class="rules">
      🕹️ <b>Управление:</b> WASD / стрелки<br>
      🖱️ <b>Стрельба и прицел:</b> мышка<br>
      🛒 <b>Магазин:</b> кнопка в углу<br>
      🧟 <b>Цель:</b> убивай зомби и собирай золото!
    </div>
    <button onclick="startGame()">ИГРАТЬ</button>
  </div>

  <div class="overlay" id="deathScreen">
    <h1 class="dead">💀 ТЫ ПОГИБ</h1>
    <div class="big" id="finalKills">0</div>
    <p>зомби убито</p>
    <p style="font-size:14px;color:#666">Рекорд: <b id="bestKills">0</b> • Волна: <b id="finalWave">1</b></p>
    <button onclick="restartGame()">ЕЩЁ РАЗ</button>
  </div>

  <div id="shopScreen">
    <h1>🛒 МАГАЗИН</h1>
    <p>Золото: <b id="shopGold">0</b> 🪙</p>
    <div id="shopList"></div>
    <button class="close-btn" onclick="toggleShop()">ЗАКРЫТЬ</button>
  </div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, gameOver = false, isPaused = false;
let score = 0, gold = 0, wave = 1, waveTimer = 0;
let enemies = [], bullets = [], particles = [], drops = [];

// Игрок
const player = { x: 0, y: 0, hp: 100, maxHp: 100, speed: 250, fireCooldown: 0, angle: 0 };
const keys = {};
const mouse = { x: 0, y: 0, down: false, moved: false };

// Улучшения
const upgrades = { damage: 1, fireRate: 1, health: 1, speed: 1, magnet: 1 };
const upgradeLevels = { damage: 0, fireRate: 0, health: 0, speed: 0, magnet: 0 };
const upgradeCosts = { damage: 20, fireRate: 30, health: 40, speed: 25, magnet: 50 };

// Трава
const decorations = [];
for (let i = 0; i < 500; i++) {
  decorations.push({
    x: (Math.random() - 0.5) * 4000, y: (Math.random() - 0.5) * 4000,
    type: Math.random() < 0.8 ? 'grass' : 'rock',
    size: 5 + Math.random() * 20, rotation: Math.random() * Math.PI * 2
  });
}

function resize() {
  const rect = cv.parentElement.getBoundingClientRect();
  W = cv.width = rect.width;
  H = cv.height = rect.height;
}
window.addEventListener('resize', resize);
resize();

// Отправка в хаб
function sendToHub(type, data) {
  if (window.parent !== window) {
    window.parent.postMessage({ type: type, game: 'zombie', ...data }, '*');
  }
}

function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('deathScreen').classList.remove('show');
  document.getElementById('shopScreen').classList.remove('show');
  
  gameOver = false;
  score = 0; gold = 0; wave = 1; waveTimer = 0;
  player.x = 0; player.y = 0; player.hp = 100; player.maxHp = 100;
  player.speed = 250; player.angle = 0;
  enemies = []; bullets = []; particles = []; drops = [];
  mouse.moved = false;
  
  upgrades.damage = 1; upgrades.fireRate = 1; upgrades.health = 1; upgrades.speed = 1; upgrades.magnet = 1;
  upgradeLevels.damage = 0; upgradeLevels.fireRate = 0; upgradeLevels.health = 0; upgradeLevels.speed = 0; upgradeLevels.magnet = 0;
  
  resize(); // На случай смены разрешения
  updateHUD();
}

function restartGame() { startGame(); }

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'b') toggleShop();
  if (e.key === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// Мышь: расчет строго относительно canvas, а не окна
cv.addEventListener('pointermove', e => { 
  const rect = cv.getBoundingClientRect();
  mouse.x = e.clientX - rect.left; 
  mouse.y = e.clientY - rect.top; 
  mouse.moved = true; 
});

cv.addEventListener('pointerdown', () => mouse.down = true);
cv.addEventListener('pointerup', () => mouse.down = false);
cv.addEventListener('contextmenu', e => e.preventDefault());

document.getElementById('btnShop').addEventListener('click', toggleShop);

function toggleShop() {
  if (gameOver) return;
  isPaused = !isPaused;
  document.getElementById('shopScreen').classList.toggle('show', isPaused);
  if (isPaused) updateShopUI();
}

function updateShopUI() {
  document.getElementById('shopGold').innerText = gold;
  const list = document.getElementById('shopList');
  list.innerHTML = '';
  const items = [
    { id: 'damage', name: 'Урон', icon: '🔫', max: 10, desc: '+20% урона' },
    { id: 'fireRate', name: 'Скорострельность', icon: '⚡', max: 10, desc: '+15% скорости' },
    { id: 'health', name: 'Здоровье', icon: '❤️', max: 10, desc: '+20 HP' },
    { id: 'speed', name: 'Скорость бега', icon: '👟', max: 8, desc: '+10% скорости' },
    { id: 'magnet', name: 'Магнит', icon: '🧲', max: 5, desc: '+20% радиус' }
  ];
  items.forEach(item => {
    const lvl = upgradeLevels[item.id];
    const cost = upgradeCosts[item.id] * (lvl + 1);
    const canBuy = gold >= cost && lvl < item.max;
    const div = document.createElement('div');
    div.className = 'shop-item';
    div.innerHTML = `
      <div class="icon">${item.icon}</div>
      <div class="info">
        <div class="name">${item.name} <span class="lvl">Ур. ${lvl}/${item.max}</span></div>
        <div class="desc">${item.desc}</div>
      </div>
      <button ${canBuy ? '' : 'disabled'} style="background:${canBuy ? '#a06bff' : 'rgba(255,255,255,0.05)'}; color:${canBuy ? '#fff' : '#555'};">
        ${lvl >= item.max ? 'MAX' : cost + ' 🪙'}
      </button>
    `;
    div.querySelector('button').onclick = () => {
      if (canBuy) {
        gold -= cost;
        upgradeLevels[item.id]++;
        if (item.id === 'damage') upgrades.damage = 1 + upgradeLevels.damage * 0.2;
        if (item.id === 'fireRate') upgrades.fireRate = 1 + upgradeLevels.fireRate * 0.15;
        if (item.id === 'speed') upgrades.speed = 1 + upgradeLevels.speed * 0.1;
        if (item.id === 'magnet') upgrades.magnet = 1 + upgradeLevels.magnet * 0.2;
        if (item.id === 'health') {
          upgrades.health = 1 + upgradeLevels.health * 0.2;
          player.maxHp = 100 * upgrades.health;
          player.hp = player.maxHp;
        }
        updateShopUI();
      }
    };
    list.appendChild(div);
  });
}

function updateHUD() {
  document.getElementById('hHp').textContent = Math.max(0, Math.ceil(player.hp));
  document.getElementById('hGold').textContent = gold;
  document.getElementById('hWave').textContent = wave;
  document.getElementById('hKills').textContent = score;
  const pct = (player.hp / player.maxHp) * 100;
  const fill = document.getElementById('hpFill');
  fill.style.width = pct + '%';
  fill.style.background = pct > 50 ? 'linear-gradient(90deg,#5bff9d,#5be3ff)' : pct > 25 ? 'linear-gradient(90deg,#ffd86b,#ff9a5b)' : 'linear-gradient(90deg,#ff5b7f,#ff9a5b)';
}

function spawnEnemy() {
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.max(W, H) * 0.8;
  const hp = 30 + wave * 10;
  enemies.push({
    x: player.x + Math.cos(angle) * dist, y: player.y + Math.sin(angle) * dist,
    hp, maxHp: hp, speed: 60 + wave * 5, size: 15, wobble: Math.random() * 10, hitFlash: 0
  });
}

function update(dt) {
  if (gameOver || isPaused) return;

  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'] || keys['ц']) dy -= 1;
  if (keys['s'] || keys['arrowdown'] || keys['ы']) dy += 1;
  if (keys['a'] || keys['arrowleft'] || keys['ф']) dx -= 1;
  if (keys['d'] || keys['arrowright'] || keys['в']) dx += 1;
  
  let isMoving = false;
  if (dx !== 0 || dy !== 0) {
    isMoving = true;
    const len = Math.hypot(dx, dy);
    player.x += (dx / len) * player.speed * upgrades.speed * dt;
    player.y += (dy / len) * player.speed * upgrades.speed * dt;
  }

  // ПОВОРОТ (Исправлено)
  // Персонаж всегда в центре экрана (W/2, H/2), так что вектор до мыши = (mouse.x - W/2, mouse.y - H/2)
  if (mouse.moved) {
    const dxAim = mouse.x - (W / 2);
    const dyAim = mouse.y - (H / 2);
    player.angle = Math.atan2(dyAim, dxAim);
  } else if (isMoving) {
    player.angle = Math.atan2(dy, dx);
  }

  // Стрельба
  player.fireCooldown -= dt;
  if (mouse.down && player.fireCooldown <= 0) {
    player.fireCooldown = 0.25 / upgrades.fireRate;
    bullets.push({
      x: player.x, y: player.y,
      vx: Math.cos(player.angle) * 800, vy: Math.sin(player.angle) * 800,
      life: 1, damage: 20 * upgrades.damage
    });
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) bullets.splice(i, 1);
  }

  waveTimer += dt;
  if (waveTimer > 20) { wave++; waveTimer = 0; updateHUD(); }
  if (Math.random() < dt * 1.5) spawnEnemy();

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hitFlash > 0) e.hitFlash -= dt;
    e.wobble += dt * 10;
    const zdx = player.x - e.x, zdy = player.y - e.y;
    const zdist = Math.hypot(zdx, zdy);
    
    if (zdist > 10) {
      e.x += (zdx / zdist) * e.speed * dt;
      e.y += (zdy / zdist) * e.speed * dt;
    }
    if (zdist < e.size + 15) {
      player.hp -= 20 * dt;
      if (player.hp <= 0) { player.hp = 0; gameOver = true; triggerGameOver(); }
    }
    
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.size + 5) {
        e.hp -= b.damage; e.hitFlash = 0.1;
        bullets.splice(j, 1);
        if (e.hp <= 0) {
          enemies.splice(i, 1); score++;
          drops.push({ x: e.x, y: e.y, val: 5, life: 10 });
          sendToHub('score', { score: score });
          if (score >= 50) sendToHub('achievement', { id: 'zombie_50' });
          if (score >= 500) sendToHub('achievement', { id: 'zombie_500' });
          updateHUD();
          break;
        }
      }
    }
  }

  const magnetRange = 100 * upgrades.magnet;
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.life -= dt;
    const ddx = player.x - d.x, ddy = player.y - d.y;
    const ddist = Math.hypot(ddx, ddy);
    if (ddist < magnetRange) { d.x += (ddx / ddist) * 300 * dt; d.y += (ddy / ddist) * 300 * dt; }
    if (ddist < 20 || d.life <= 0) {
      if (ddist < 20) gold += d.val;
      drops.splice(i, 1); updateHUD();
    }
  }
}

function triggerGameOver() {
  sendToHub('score', { score: score });
  document.getElementById('finalKills').textContent = score;
  document.getElementById('finalWave').textContent = wave;
  const best = localStorage.getItem('best_zombie') || 0;
  document.getElementById('bestKills').textContent = Math.max(score, best);
  document.getElementById('deathScreen').classList.add('show');
}

function draw() {
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, W, H);
  
  const camX = W/2 - player.x;
  const camY = H/2 - player.y;

  // Трава
  decorations.forEach(d => {
    const sx = d.x + camX, sy = d.y + camY;
    if (sx < -100 || sx > W + 100 || sy < -100 || sy > H + 100) return;
    if (d.type === 'grass') {
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(d.rotation);
      ctx.strokeStyle = '#2e5a32'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-d.size/2, -d.size, -d.size/3, -d.size*1.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(d.size/2, -d.size, d.size/3, -d.size*1.5); ctx.stroke();
      ctx.restore();
    } else {
      ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.arc(sx, sy, d.size/2, 0, Math.PI*2); ctx.fill();
    }
  });

  // Дропы
  ctx.fillStyle = '#ffd86b';
  ctx.shadowBlur = 15; ctx.shadowColor = '#ffd86b';
  drops.forEach(d => { ctx.beginPath(); ctx.arc(d.x + camX, d.y + camY, 8, 0, Math.PI*2); ctx.fill(); });
  ctx.shadowBlur = 0;

  // Пули
  ctx.fillStyle = '#fff';
  bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x + camX, b.y + camY, 5, 0, Math.PI*2); ctx.fill(); });

  // Враги
  enemies.forEach(e => {
    const wobble = Math.sin(e.wobble) * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(e.x + camX, e.y + camY + e.size/2, e.size, e.size/2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = e.hitFlash > 0 ? '#fff' : '#5b7f5b'; ctx.beginPath(); ctx.arc(e.x + camX + wobble, e.y + camY, e.size, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(e.x + camX + wobble - 6, e.y + camY - 5, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(e.x + camX + wobble + 6, e.y + camY - 5, 4, 0, Math.PI*2); ctx.fill();
  });

  // Игрок
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(W/2, H/2 + 12, 18, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#5be3ff'; ctx.beginPath(); ctx.arc(W/2, H/2, 18, 0, Math.PI*2); ctx.fill();
  
  ctx.save(); ctx.translate(W/2, H/2); ctx.rotate(player.angle);
  ctx.fillStyle = '#a06bff'; ctx.fillRect(12, -5, 24, 10);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

let lastTime = performance.now();
function loop(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.05);
  lastTime = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
