<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tap Ascension</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0a1a;
  background-image:radial-gradient(circle at 20% 10%,rgba(120,60,220,.25),transparent 45%),
  radial-gradient(circle at 80% 30%,rgba(0,200,255,.12),transparent 45%);
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;
  display:flex;justify-content:center;align-items:center}
.game{width:100%;max-width:440px;height:100vh;display:flex;flex-direction:column;padding:12px;gap:10px;position:relative}

/* Кнопка в хаб */
.back-hub-btn {
  position: fixed; top: 15px; left: 15px; z-index: 9999999;
  background: linear-gradient(135deg, #a06bff, #6b3fcf);
  color: #fff; text-decoration: none; font-weight: 800; font-size: 14px;
  padding: 10px 20px; border-radius: 30px; border: 2px solid rgba(255,255,255,0.8);
  box-shadow: 0 4px 15px rgba(0,0,0,0.6); transition: 0.2s; font-family: inherit;
  display: flex; align-items: center; gap: 6px;
}
.back-hub-btn:hover { transform: scale(1.05); background: linear-gradient(135deg, #b07cff, #7b4fdf); }

.header{text-align:center;z-index:2}
.title{font-size:11px;letter-spacing:4px;color:#a06bff;font-weight:700;opacity:.8}
.score{font-size:46px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff 20%,#ffd86b 90%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 16px rgba(255,200,50,.5));transition:transform 0.1s}
.stats-row{display:flex;justify-content:center;gap:14px;margin-top:4px;font-size:12px;color:#9aa0c0}
.stats-row b{color:#ffd86b}

.combo-bar{margin-top:6px;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.combo-fill{height:100%;width:0;background:linear-gradient(90deg,#a06bff,#5be3ff);transition:width .1s linear}
.combo-label{font-size:10px;color:#5be3ff;letter-spacing:2px;margin-top:3px;height:12px;opacity:0;transition:opacity .2s;font-weight:700}
.combo-label.active{opacity:1}

.tap-zone{flex:1;display:flex;justify-content:center;align-items:center;position:relative;min-height:180px;z-index:2}
.coin{width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff5cc,#ffd86b 40%,#c9961a 100%);
  box-shadow:0 0 70px rgba(255,190,0,.5),inset 0 -12px 24px rgba(120,70,0,.55),inset 0 12px 24px rgba(255,255,220,.9);
  display:flex;justify-content:center;align-items:center;font-size:84px;cursor:pointer;
  transition:transform .07s ease;position:relative;z-index:2;will-change:transform}
.coin:active{transform:scale(.9)}
.coin.frenzy{animation:coinFrenzy 0.1s infinite}
@keyframes coinFrenzy{0%{transform:scale(1) rotate(0)}50%{transform:scale(1.05) rotate(2deg)}100%{transform:scale(1) rotate(0)}}

.frenzy-overlay{position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(circle at 50% 50%, rgba(255,91,127,.4), transparent 70%);
  opacity:0;transition:opacity .2s}
.frenzy-overlay.active{opacity:1;animation:pulseFrenzy 0.5s infinite alternate}
@keyframes pulseFrenzy{from{transform:scale(1)}to{transform:scale(1.1)}}

.float-text{position:absolute;font-size:24px;font-weight:900;color:#ffd86b;pointer-events:none;
  animation:floatUp .9s cubic-bezier(.2,.8,.3,1) forwards;text-shadow:0 2px 10px rgba(0,0,0,.8);z-index:10;white-space:nowrap}
.float-text.crit{color:#ff5b7f;font-size:30px;text-shadow:0 0 16px #ff5b7f}
@keyframes floatUp{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-180%) scale(1);opacity:0}}

.shop-tabs{display:flex;gap:6px;z-index:2}
.tab{flex:1;padding:8px;text-align:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);border-radius:10px;cursor:pointer;color:#7a80a0}
.tab.active{color:#fff;background:rgba(160,107,255,.2);border-color:#a06bff;box-shadow:0 0 14px rgba(160,107,255,.3)}
.shop{height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px;z-index:2}
.shop::-webkit-scrollbar{width:5px}
.shop::-webkit-scrollbar-thumb{background:#a06bff;border-radius:3px}
.upgrade{display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;
  cursor:pointer;transition:.15s;position:relative;text-align:left;color:#fff;font-family:inherit}
.upgrade:hover:not(:disabled){background:rgba(160,107,255,.18);border-color:rgba(160,107,255,.5)}
.upgrade:active:not(:disabled){transform:scale(.98)}
.upgrade:disabled{opacity:.4;cursor:not-allowed}
.upgrade .icon{font-size:24px;width:42px;height:42px;min-width:42px;display:flex;justify-content:center;align-items:center;
  background:rgba(160,107,255,.15);border-radius:10px}
.upgrade .info{flex:1;min-width:0}
.upgrade .name{font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center}
.upgrade .lvl{font-size:10px;background:rgba(160,107,255,.3);padding:1px 6px;border-radius:6px;color:#5be3ff;font-weight:700}
.upgrade .desc{font-size:11px;color:#9aa0c0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upgrade .cost{font-weight:900;font-size:13px;color:#ffd86b;white-space:nowrap}

.footer{display:flex;justify-content:space-between;font-size:11px;color:#555a75;padding:2px 4px;z-index:2}
.footer .btn{cursor:pointer;padding:6px 12px;border-radius:8px;background:rgba(255,255,255,.05);transition:0.2s;font-weight:700}
.footer .btn:hover{background:rgba(255,255,255,.1);color:#fff}
.footer .btn.danger:hover{background:rgba(255,91,127,.2);color:#ff5b7f}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;
  z-index:100;padding:20px;backdrop-filter:blur(5px)}
.modal.show{display:flex}
.modal-box{background:linear-gradient(160deg,#1a1a35,#0f0f22);border:1px solid #a06bff;border-radius:20px;padding:24px;
  max-width:340px;width:100%;box-shadow:0 0 60px rgba(160,107,255,0.4);animation:modalIn .3s ease}
@keyframes modalIn{from{transform:scale(0.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box h2{font-size:22px;margin-bottom:10px;background:linear-gradient(90deg,#a06bff,#5be3ff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.modal-box p{font-size:13px;color:#9aa0c0;line-height:1.5;margin-bottom:16px}
.modal-box .big{font-size:32px;font-weight:900;color:#ffd86b;text-align:center;margin:12px 0}
.modal-box button{width:100%;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:800;
  font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#a06bff,#6b3fcf);color:#fff;margin-top:8px;transition:0.2s}
.modal-box button:hover{filter:brightness(1.15)}
.modal-box button.cancel{background:rgba(255,255,255,.08);color:#9aa0c0}
</style>
</head>
<body>

<!-- ВОТ ОНА, КНОПКА ВОЗВРАТА (В САМОМ НАЧАЛЕ BODY) -->
<a href="index.html" class="back-hub-btn">🏠 В Хаб</a>

<div class="game">
  <div class="frenzy-overlay" id="frenzyOverlay"></div>

  <div class="header">
    <div class="title">ASCENSION</div>
    <div class="score" id="score">0</div>
    <div class="stats-row">
      <span>Тап: <b id="perTap">+1</b></span>
      <span>Авто: <b id="perSec">+0/с</b></span>
      <span>Множ: <b id="mult">x1</b></span>
    </div>
    <div class="combo-bar"><div class="combo-fill" id="comboFill"></div></div>
    <div class="combo-label" id="comboLabel"></div>
  </div>

  <div class="tap-zone" id="tapZone">
    <div class="coin" id="coin">💎</div>
  </div>

  <div class="shop-tabs">
    <div class="tab active" data-tab="tap">👆 Тап</div>
    <div class="tab" data-tab="auto">🤖 Авто</div>
    <div class="tab" data-tab="special">✨ Особые</div>
  </div>

  <div class="shop" id="shop"></div>

  <div class="footer">
    <div class="btn" id="btnPrestige">🌟 Престиж</div>
    <div class="btn" id="btnStats">📊 Статы</div>
    <div class="btn danger" id="btnReset">🗑 Сброс</div>
  </div>
</div>

<div class="modal" id="modalPrestige">
  <div class="modal-box">
    <h2>🌟 Престиж</h2>
    <p>Сбросить прогресс и получить звёзды (+10% дохода за каждую).</p>
    <div class="big" id="prestigeGain">+0 🌟</div>
    <p style="text-align:center">Звёзд: <b id="prestigeStars">0</b></p>
    <button id="btnPrestigeOK">Престиж!</button>
    <button class="cancel" onclick="closeModal('modalPrestige')">Отмена</button>
  </div>
</div>

<div class="modal" id="modalStats">
  <div class="modal-box">
    <h2>📊 Статистика</h2>
    <p id="statsText" style="line-height:2;"></p>
    <button class="cancel" onclick="closeModal('modalStats')">Закрыть</button>
  </div>
</div>

<div class="modal" id="modalReset">
  <div class="modal-box">
    <h2>🗑 Сброс</h2>
    <p>Вы уверены, что хотите полностью удалить сохранение? Это действие нельзя отменить.</p>
    <button style="background:linear-gradient(135deg,#ff5b7f,#ff9a5b);" onclick="confirmReset()">Да, удалить</button>
    <button class="cancel" onclick="closeModal('modalReset')">Отмена</button>
  </div>
</div>

<script>
const UP = {
  power:      {n:'Сила тапа',      i:'👆',t:'tap',    d:l=>`+${1+l} к тапу`,           c:l=>10*1.7**l|0,     e:l=>1+l},
  critChance: {n:'Шанс крита',     i:'⚡',t:'tap',    d:l=>`${l*4}% шанс крита`,       c:l=>50*1.9**l|0,     e:l=>l*.04, max:15},
  critPower:  {n:'Сила крита',     i:'💥',t:'tap',    d:l=>`Крит x${5+l*2}`,           c:l=>300*2.1**l|0,    e:l=>5+l*2, max:20, req:['critChance',1]},
  combo:      {n:'Комбо-мастер',   i:'🔥',t:'tap',    d:l=>`Комбо +${5+l*5}%`,       c:l=>200*2**l|0,      e:l=>.05+l*.05, req:['power',5]},
  tapMult:    {n:'Множ. тапа',     i:'✨',t:'tap',    d:l=>`Тап x${(1+l*.5).toFixed(1)}`,c:l=>2000*2.5**l|0, e:l=>1+l*.5, max:10, req:['critPower',2]},
  auto:       {n:'Автоклик',       i:'🤖',t:'auto',   d:l=>`+${l} монет/сек`,          c:l=>100*1.8**l|0,    e:l=>l},
  autoSpeed:  {n:'Ускорение',      i:'⏩',t:'auto',   d:l=>`+${l*20}% автодохода`,     c:l=>800*2**l|0,      e:l=>1+l*.2, req:['auto',5]},
  autoCrit:   {n:'Авто-криты',     i:'🎯',t:'auto',   d:l=>`${l*3}% шанс x3`,          c:l=>3000*2.3**l|0,   e:l=>l*.03, max:15, req:['autoSpeed',3]},
  golden:     {n:'Золотое касание',i:'👑',t:'special',d:l=>`Все монеты +${l*15}%`,      c:l=>5000*2.8**l|0,   e:l=>1+l*.15, max:20},
  luck:       {n:'Удача',          i:'🍀',t:'special',d:l=>`+${l*10}% шанса крита`,    c:l=>1500*2.2**l|0,   e:l=>1+l*.1, max:10, req:['critChance',3]},
  multiplier: {n:'Множ. дохода',   i:'💎',t:'special',d:l=>`Доход x${(1+l).toFixed(1)}`,c:l=>10000*3**l|0,    e:l=>1+l, max:10, req:['golden',2]},
};

const S = {coins:0, lv:{}, stars:0, taps:0, earned:0, combo:0, cTimer:0, lastTap:0, tab:'tap', frenzy:false, frenzyTimer:0};
for (const k in UP) S.lv[k]=0;

const save = () => localStorage.setItem('tapV2', JSON.stringify({coins:S.coins,lv:S.lv,stars:S.stars,taps:S.taps,earned:S.earned}));
const load = () => {
  try {
    const d = JSON.parse(localStorage.getItem('tapV2'));
    if (!d) return;
    S.coins=d.coins||0; S.stars=d.stars||0; S.taps=d.taps||0; S.earned=d.earned||0;
    if (d.lv) for (const k in S.lv) S.lv[k]=d.lv[k]||0;
  } catch(e){}
};

const eff = k => UP[k] ? UP[k].e(S.lv[k]||0) : 0;
const cost = k => { const u=UP[k], l=S.lv[k]||0; if (u.max && l>=u.max) return Infinity; return u.c(l); };
const locked = k => { const u=UP[k]; return u.req && (S.lv[u.req[0]]||0) < u.req[1]; };
const canBuy = k => { const u=UP[k], l=S.lv[k]||0; if (u.max && l>=u.max) return false; if (locked(k)) return false; return S.coins >= cost(k); };
const stats = () => {
  const g = eff('multiplier') * eff('golden') * (1 + S.stars*.1);
  return {
    perTap: eff('power') * eff('tapMult') * g,
    perSec: eff('auto') * eff('autoSpeed') * g,
    critChance: Math.min(.9, eff('critChance') * eff('luck')),
    critPower: eff('critPower') || 5,
    comboBonus: eff('combo'),
    globalMult: g,
  };
};

const fmt = n => n<1e3 ? Math.floor(n) : n<1e6 ? (n/1e3).toFixed(1)+'K' : n<1e9 ? (n/1e6).toFixed(2)+'M' : n<1e12 ? (n/1e9).toFixed(2)+'B' : (n/1e12).toFixed(2)+'T';

const $ = id => document.getElementById(id);
const scoreEl=$('score'), perTapEl=$('perTap'), perSecEl=$('perSec'), multEl=$('mult'),
      comboFill=$('comboFill'), comboLabel=$('comboLabel'), tapZone=$('tapZone'), shopEl=$('shop');

function updateUI() {
  const s = stats();
  scoreEl.textContent = fmt(S.coins);
  perTapEl.textContent = '+' + fmt(s.perTap) + (S.frenzy ? ' x2' : '');
  perSecEl.textContent = '+' + fmt(s.perSec) + '/с';
  multEl.textContent = 'x' + s.globalMult.toFixed(2);
  updateShop();
}

function updateShop() {
  const keys = Object.keys(UP).filter(k => UP[k].t === S.tab);
  if (shopEl.dataset.tab !== S.tab) {
    shopEl.innerHTML = ''; shopEl.dataset.tab = S.tab;
    keys.forEach(k => {
      const u = UP[k];
      const row = document.createElement('button');
      row.className = 'upgrade'; row.id = 'u-'+k;
      row.innerHTML = `<div class="icon">${u.i}</div>
        <div class="info"><div class="name">${u.n} <span class="lvl">Ур.0</span></div><div class="desc"></div></div>
        <div class="cost"></div>`;
      row.onclick = () => buy(k);
      shopEl.appendChild(row);
    });
  }
  keys.forEach(k => {
    const row = $('u-'+k); if (!row) return;
    const u=UP[k], l=S.lv[k]||0, c=cost(k);
    const maxed = u.max && l>=u.max;
    const lk = locked(k);
    row.querySelector('.lvl').textContent = 'Ур.'+l;
    row.querySelector('.desc').textContent = u.d(l);
    const cEl = row.querySelector('.cost');
    if (maxed) cEl.innerHTML = '<span style="color:#5bff9d">MAX</span>';
    else if (lk) cEl.innerHTML = `<span style="color:#ff5b7f;font-size:11px">🔒 ${UP[u.req[0]].n} ${u.req[1]}</span>`;
    else cEl.textContent = '💰'+fmt(c);
    row.disabled = !canBuy(k);
  });
}

function buy(k) {
  if (!canBuy(k)) return;
  S.coins -= cost(k);
  S.lv[k]++;
  updateUI(); save();
}

let pressTimer = null;
const coin = $('coin');

function startPress(e) {
  e.preventDefault();
  pressTimer = setTimeout(() => {
    if (!S.frenzy) {
      S.frenzy = true;
      S.frenzyTimer = 5;
      coin.classList.add('frenzy');
      $('frenzyOverlay').classList.add('active');
      handleTap(e, true);
    }
  }, 500);
}

function endPress() { clearTimeout(pressTimer); }

coin.addEventListener('pointerdown', startPress);
coin.addEventListener('pointerup', endPress);
coin.addEventListener('pointerleave', endPress);
coin.addEventListener('pointercancel', endPress);
coin.addEventListener('pointerdown', (e) => handleTap(e));

function handleTap(e, isFrenzyStart = false) {
  const now = performance.now();
  const s = stats();
  
  S.combo = (now - S.lastTap < 600) ? Math.min(S.combo+1, 50) : 1;
  S.lastTap = now;
  S.cTimer = 2000;

  const comboMult = 1 + S.combo * s.comboBonus;
  const frenzyMult = S.frenzy ? 2 : 1;
  let amount = s.perTap * comboMult * frenzyMult;
  let crit = false;
  if (Math.random() < s.critChance) { amount *= s.critPower; crit = true; }

  S.coins += amount;
  S.earned += amount;
  S.taps++;

  showFloat(amount, e, crit || isFrenzyStart);
  updateUI(); save();
}

function showFloat(amount, e, isCrit) {
  const r = tapZone.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'float-text' + (isCrit ? ' crit' : '');
  el.textContent = (isCrit ? 'КРИТ! +' : '+') + fmt(amount);
  el.style.left = ((e.clientX ?? r.left+r.width/2) - r.left) + 'px';
  el.style.top  = ((e.clientY ?? r.top+r.height/2) - r.top) + 'px';
  tapZone.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

function tick() {
  if (S.cTimer > 0) {
    S.cTimer -= 100;
    comboFill.style.width = Math.max(0, S.cTimer/2000*100) + '%';
    if (S.combo > 1) { comboLabel.textContent = '🔥 COMBO x'+S.combo; comboLabel.classList.add('active'); }
    if (S.cTimer <= 0) { S.combo=0; comboFill.style.width='0'; comboLabel.classList.remove('active'); }
  }
  if (S.frenzy) {
    S.frenzyTimer -= 0.1;
    if (S.frenzyTimer <= 0) {
      S.frenzy = false;
      coin.classList.remove('frenzy');
      $('frenzyOverlay').classList.remove('active');
      updateUI();
    }
  }
}

setInterval(() => {
  const s = stats();
  if (s.perSec <= 0) return;
  S.coins += s.perSec / 10;
  S.earned += s.perSec / 10;
}, 100);

$('btnPrestige').onclick = () => {
  const gain = Math.floor(Math.sqrt(S.earned / 1e6));
  $('prestigeGain').textContent = '+' + gain + ' 🌟';
  $('prestigeStars').textContent = S.stars;
  $('modalPrestige').classList.add('show');
};

$('btnPrestigeOK').onclick = () => {
  const gain = Math.floor(Math.sqrt(S.earned / 1e6));
  if (gain > 0) {
    S.stars += gain; S.coins = 0; S.earned = 0; S.combo = 0;
    for (const k in S.lv) S.lv[k] = 0;
    updateUI(); save();
  }
  closeModal('modalPrestige');
};

$('btnStats').onclick = () => {
  const s = stats();
  $('statsText').innerHTML = `
    Всего тапов: <b>${S.taps}</b><br>
    Заработано: <b>${fmt(S.earned)}</b><br>
    Монет: <b>${fmt(S.coins)}</b><br>
    Доход/сек: <b>${fmt(s.perSec)}</b><br>
    За тап: <b>${fmt(s.perTap)}</b><br>
    Крит: <b>${(s.critChance*100).toFixed(0)}% x${s.critPower}</b><br>
    Звёзд: <b>${S.stars}</b>
  `;
  $('modalStats').classList.add('show');
};

$('btnReset').onclick = () => $('modalReset').classList.add('show');

function confirmReset() {
  localStorage.removeItem('tapV2');
  location.reload();
}

function closeModal(id) { $(id).classList.remove('show'); }

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active'); S.tab = t.dataset.tab; updateShop();
});

load();
setInterval(tick, 100);
setInterval(updateUI, 500);
setInterval(save, 5000);
updateUI();
</script>
</body>
</html>
