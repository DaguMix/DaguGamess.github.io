<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ГИБДД Рулетка</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0f1115; font-family: 'Montserrat', -apple-system, sans-serif; color: #fff; display: flex; justify-content: center; }
#app { width: 100%; max-width: 1200px; height: 100vh; display: flex; flex-direction: column; }

/* Шапка */
.top-bar { height: 70px; background: #14171c; border-bottom: 2px solid #21262e; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 10; }
.logo { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 1px; }
.logo span { color: #ffd86b; }
.balance { font-size: 16px; font-weight: 800; color: #5bff9d; background: #1a1e24; padding: 10px 20px; border-radius: 8px; border: 1px solid #2a303a; display: flex; align-items: center; gap: 8px; }
.balance .coin { font-size: 20px; }

/* Основной контент */
.main-content { display: flex; flex: 1; overflow: hidden; }

/* Инвентарь (Слева) */
.inventory { width: 320px; background: #101217; border-right: 1px solid #21262e; display: flex; flex-direction: column; }
.inv-header { padding: 16px; font-size: 14px; font-weight: 800; color: #8b929e; text-transform: uppercase; border-bottom: 1px solid #21262e; text-align: center; display: flex; justify-content: space-between; align-items: center; }
.inv-header .count { background: #f27a15; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
.inv-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.inv-item { background: #181c22; border-radius: 8px; padding: 12px; display: flex; align-items: center; justify-content: space-between; border-left: 4px solid #fff; }
.inv-info { display: flex; flex-direction: column; gap: 4px; }
.inv-name { font-size: 16px; font-weight: 900; letter-spacing: 2px; background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; font-family: monospace; }
.inv-rarity { font-size: 10px; font-weight: 800; text-transform: uppercase; }
.inv-sell { background: #2a303a; border: none; color: #ffd86b; font-weight: 800; font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
.inv-sell:hover { background: #f27a15; color: #fff; }

/* Игровая зона (Справа) */
.game-zone { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; position: relative; background-image: radial-gradient(circle at 50% 0%, rgba(255,216,107,0.05), transparent 60%); }

/* Рулетка */
.roulette-container { width: 100%; max-width: 900px; height: 140px; background: #101217; border: 2px solid #21262e; border-radius: 12px; margin-top: 20px; position: relative; overflow: hidden; box-shadow: inset 0 0 30px rgba(0,0,0,0.9); }
.roulette-track { display: flex; gap: 10px; height: 100%; align-items: center; transition: transform 4s cubic-bezier(0.1, 0.7, 0.3, 1); padding: 0 10px; }
.roulette-item { width: 130px; height: 100px; background: #181c22; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; flex-shrink: 0; border: 1px solid #2a303a; border-bottom: 4px solid #fff; }
.roulette-item .plate { font-size: 18px; font-weight: 900; letter-spacing: 1px; background: #fff; color: #000; padding: 4px 8px; border-radius: 4px; font-family: monospace; }
.roulette-item .price { font-size: 11px; font-weight: 800; margin-top: 8px; }
.pointer { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #f27a15; transform: translateX(-50%); z-index: 5; box-shadow: 0 0 20px #f27a15; }
.pointer::before { content: ''; position: absolute; top: 0; left: -8px; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 14px solid #f27a15; }
.pointer::after { content: ''; position: absolute; bottom: 0; left: -8px; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 14px solid #f27a15; }

/* Прокачка */
.upgrades { display: flex; gap: 20px; margin-top: 40px; width: 100%; max-width: 800px; }
.upg-card { flex: 1; background: #181c22; border: 1px solid #2a303a; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.upg-icon { font-size: 32px; margin-bottom: 10px; }
.upg-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
.upg-desc { font-size: 12px; color: #8b929e; margin-bottom: 16px; line-height: 1.4; }
.upg-btn { width: 100%; background: linear-gradient(135deg, #5be3ff, #5bff9d); color: #001; border: none; padding: 12px; border-radius: 8px; font-weight: 900; font-size: 14px; cursor: pointer; transition: 0.2s; }
.upg-btn:hover { filter: brightness(1.1); transform: scale(1.02); }
.upg-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Кнопка крутки */
.spin-btn { margin-top: 40px; background: linear-gradient(90deg, #f27a15, #d95f00); color: #fff; border: none; padding: 20px 80px; border-radius: 12px; font-size: 20px; font-weight: 900; cursor: pointer; text-transform: uppercase; box-shadow: 0 10px 30px rgba(242,122,21,0.4); transition: 0.2s; letter-spacing: 2px; }
.spin-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(242,122,21,0.6); }
.spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Модалка */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 100; }
.modal.show { display: flex; }
.modal-box { background: #14171c; border: 2px solid #f27a15; border-radius: 20px; padding: 40px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
.modal-box h2 { font-size: 24px; margin-bottom: 20px; color: #f27a15; text-transform: uppercase; }
.result-plate { font-size: 32px; font-weight: 900; letter-spacing: 3px; background: #fff; color: #000; padding: 10px 20px; border-radius: 8px; display: inline-block; font-family: monospace; margin-bottom: 10px; }
.result-price { font-size: 28px; font-weight: 900; color: #5bff9d; margin-bottom: 30px; }
.modal-box button { background: linear-gradient(135deg, #5be3ff, #5bff9d); color: #001; border: none; padding: 16px 40px; border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.2s; width: 100%; }
.modal-box button:hover { filter: brightness(1.1); }
</style>
</head>
<body>

<div id="app">
  <!-- Шапка -->
  <div class="top-bar">
    <div class="logo">ГИБДД <span>РУЛЕТКА</span></div>
    <div class="balance">
      <span class="coin">🪙</span>
      <span id="balanceText">1000</span>
    </div>
  </div>

  <div class="main-content">
    <!-- Инвентарь -->
    <div class="inventory">
      <div class="inv-header">
        <span>Мои номера</span>
        <span class="count" id="invCount">0</span>
      </div>
      <div class="inv-list" id="invList">
        <!-- Сюда падают номера -->
      </div>
    </div>

    <!-- Игровая зона -->
    <div class="game-zone">
      
      <!-- Рулетка -->
      <div class="roulette-container">
        <div class="pointer"></div>
        <div class="roulette-track" id="rouletteTrack"></div>
      </div>

      <!-- Кнопка -->
      <button class="spin-btn" id="spinBtn" onclick="startSpin()">КРУТИТЬ ЗА 50 🪙</button>

      <!-- Прокачка -->
      <div class="upgrades">
        <div class="upg-card">
          <div class="upg-icon">🍀</div>
          <div class="upg-title">Удача (Ур. <span id="luckLvl">0</span>)</div>
          <div class="upg-desc">Повышает шанс выпадения редких и дорогих номеров</div>
          <button class="upg-btn" id="btnLuck" onclick="upgradeLuck()">Прокачать за <span id="luckCost">500</span> 🪙</button>
        </div>
        <div class="upg-card">
          <div class="upg-icon">💸</div>
          <div class="upg-title">Продажа (Ур. <span id="sellLvl">0</span>)</div>
          <div class="upg-desc">Увеличивает цену продажи номеров в инвентаре на 10%</div>
          <button class="upg-btn" id="btnSell" onclick="upgradeSell()">Прокачать за <span id="sellCost">800</span> 🪙</button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Модалка выигрыша -->
<div class="modal" id="winModal">
  <div class="modal-box">
    <h2>Выпал номер!</h2>
    <div class="result-plate" id="dropPlate">А001АА</div>
    <div class="result-price" id="dropPrice">5 000 ₽</div>
    <button onclick="closeModal()">ЗАБРАТЬ В ИНВЕНТАРЬ</button>
  </div>
</div>

<script>
// --- КОНФИГ НОМЕРОВ (Редкости) ---
const PLATES = [
  { pattern: 'Х000ХХ', rarity: 'Обычный', basePrice: 100, weight: 50, color: '#8b929e' },
  { pattern: 'Х111ХХ', rarity: 'Необычный', basePrice: 350, weight: 25, color: '#5bff9d' },
  { pattern: 'Х555ХХ', rarity: 'Редкий', basePrice: 1200, weight: 12, color: '#4b69ff' },
  { pattern: 'Х777ХХ', rarity: 'Эпический', basePrice: 4500, weight: 7, color: '#8847ff' },
  { pattern: 'Х888ХХ', rarity: 'Легендарный', basePrice: 10000, weight: 4, color: '#eb4b4b' },
  { pattern: 'А001АА', rarity: 'Блатной', basePrice: 25000, weight: 2, color: '#d3a533' },
  { pattern: 'АМР', rarity: 'Правительственный', basePrice: 100000, weight: 1, color: '#ffd86b' }
];

const LETTERS = 'АВЕКМНОРСТУХ';
const DIGITS = '0123456789';

let balance = parseInt(localStorage.getItem('gibdd_balance') || 1000);
let inventory = JSON.parse(localStorage.getItem('gibdd_inv') || '[]');
let luckLvl = parseInt(localStorage.getItem('gibdd_luck') || 0);
let sellLvl = parseInt(localStorage.getItem('gibdd_sell') || 0);

let isSpinning = false;
const SPIN_COST = 50;

// --- ИНИЦИАЛИЗАЦИЯ ---
function updateUI() {
  document.getElementById('balanceText').textContent = balance;
  document.getElementById('invCount').textContent = inventory.length;
  
  document.getElementById('luckLvl').textContent = luckLvl;
  document.getElementById('sellLvl').textContent = sellLvl;
  
  const luckCost = 500 + luckLvl * 300;
  const sellCost = 800 + sellLvl * 500;
  
  document.getElementById('luckCost').textContent = luckCost;
  document.getElementById('sellCost').textContent = sellCost;
  
  document.getElementById('btnLuck').disabled = balance < luckCost || luckLvl >= 10;
  document.getElementById('btnSell').disabled = balance < sellCost || sellLvl >= 10;
  document.getElementById('spinBtn').disabled = balance < SPIN_COST;
  
  renderInventory();
  save();
}

function save() {
  localStorage.setItem('gibdd_balance', balance);
  localStorage.setItem('gibdd_inv', JSON.stringify(inventory));
  localStorage.setItem('gibdd_luck', luckLvl);
  localStorage.setItem('gibdd_sell', sellLvl);
}

function renderInventory() {
  const list = document.getElementById('invList');
  list.innerHTML = '';
  
  if (inventory.length === 0) {
    list.innerHTML = '<div style="text-align:center; color:#8b929e; font-size:12px; margin-top:20px;">Инвентарь пуст.<br>Крутите рулетку!</div>';
    return;
  }
  
  // Сортируем по цене (дорогие сверху)
  const sorted = [...inventory].sort((a, b) => b.finalPrice - a.finalPrice);
  
  sorted.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'inv-item';
    div.style.borderLeftColor = item.color;
    div.innerHTML = `
      <div class="inv-info">
        <div class="inv-name">${item.plate}</div>
        <div class="inv-rarity" style="color:${item.color}">${item.rarity}</div>
      </div>
      <button class="inv-sell" onclick="sellItem(${item.id})">Продать<br>${Math.floor(item.finalPrice).toLocaleString()} ₽</button>
    `;
    list.appendChild(div);
  });
}

// --- ГЕНЕРАЦИЯ НОМЕРА ---
function generateRandomPlate() {
  const isGov = Math.random() < 0.01; // 1% на правительственный
  if (isGov) return PLATES[6].pattern;
  
  let digits = '';
  // Выбираем паттерн цифр (три одинаковые или рандом)
  const r = Math.random();
  if (r < 0.7) {
    // Рандомные цифры
    digits = DIGITS[Math.floor(Math.random()*10)] + DIGITS[Math.floor(Math.random()*10)] + DIGITS[Math.floor(Math.random()*10)];
  } else {
    // Одинаковые (красивые)
    const d = DIGITS[Math.floor(Math.random()*10)];
    digits = d + d + d;
  }
  
  const l1 = LETTERS[Math.floor(Math.random()*LETTERS.length)];
  const l2 = LETTERS[Math.floor(Math.random()*LETTERS.length)];
  const l3 = LETTERS[Math.floor(Math.random()*LETTERS.length)];
  
  return l1 + digits + l2 + l3;
}

// --- ОПРЕДЕЛЕНИЕ РЕДКОСТИ ---
function determinePlateInfo(plate) {
  if (plate === 'АМР') return PLATES[6];
  
  const digits = plate.substring(1, 4);
  
  if (digits[0] === digits[1] && digits[1] === digits[2]) {
    if (digits === '001') return PLATES[5];
    if (digits === '777' || digits === '888') return PLATES[3];
    if (digits === '555') return PLATES[2];
    if (digits === '111') return PLATES[1];
  }
  
  return PLATES[0];
}

// --- ПРОКРУТКА ---
function startSpin() {
  if (isSpinning || balance < SPIN_COST) return;
  
  isSpinning = true;
  balance -= SPIN_COST;
  updateUI();
  
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('spinBtn').textContent = 'КРУТИТСЯ...';
  
  const track = document.getElementById('rouletteTrack');
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  
  // Генерируем ленту (100 элементов)
  const winIndex = 92; // На каком элементе остановится
  let winItem = null;
  
  for (let i = 0; i < 100; i++) {
    let plate, info;
    
    if (i === winIndex) {
      // Генерируем выигрышный (с учетом удачи)
      const luckBonus = luckLvl * 0.05;
      let roll = Math.random() - luckBonus;
      
      if (roll < 0.01) info = PLATES[6];
      else if (roll < 0.04) info = PLATES[5];
      else if (roll < 0.10) info = PLATES[4];
      else if (roll < 0.25) info = PLATES[3];
      else if (roll < 0.50) info = PLATES[2];
      else if (roll < 0.80) info = PLATES[1];
      else info = PLATES[0];
      
      plate = info.pattern === 'АМР' ? 'АМР' : generateRandomPlate();
      winItem = { plate, rarity: info.rarity, basePrice: info.basePrice, color: info.color };
    } else {
      // Обычные элементы для фона
      plate = generateRandomPlate();
      const tmpInfo = determinePlateInfo(plate);
      info = tmpInfo;
    }
    
    const div = document.createElement('div');
    div.className = 'roulette-item';
    div.style.borderBottomColor = info.color;
    div.innerHTML = `
      <div class="plate">${plate}</div>
      <div class="price" style="color:${info.color}">${info.basePrice.toLocaleString()} ₽</div>
    `;
    track.appendChild(div);
  }
  
  // Запуск анимации
  setTimeout(() => {
    track.style.transition = 'transform 4s cubic-bezier(0.1, 0.7, 0.3, 1)';
    // 1 элемент = 130px + 10px gap = 140px. Центрируем на winIndex.
    const offset = (winIndex * 140) - (track.parentElement.clientWidth / 2) + 65;
    track.style.transform = `translateX(-${offset}px)`;
  }, 50);
  
  // Конец
  setTimeout(() => {
    isSpinning = false;
    document.getElementById('spinBtn').textContent = `КРУТИТЬ ЗА ${SPIN_COST} 🪙`;
    
    // Добавляем в инвентарь (с учетом прокачки продажи)
    const sellMultiplier = 1 + (sellLvl * 0.1);
    const finalPrice = winItem.basePrice * sellMultiplier;
    
    inventory.push({
      id: Date.now(),
      plate: winItem.plate,
      rarity: winItem.rarity,
      basePrice: winItem.basePrice,
      finalPrice: finalPrice,
      color: winItem.color
    });
    
    // Показываем модалку
    document.getElementById('dropPlate').textContent = winItem.plate;
    document.getElementById('dropPlate').style.color = '#000';
    document.getElementById('dropPlate').style.border = `2px solid ${winItem.color}`;
    document.getElementById('dropPrice').textContent = Math.floor(finalPrice).toLocaleString() + ' ₽';
    document.getElementById('winModal').classList.add('show');
    
    updateUI();
  }, 4200);
}

// --- ПРОДАЖА ---
function sellItem(id) {
  const idx = inventory.findIndex(i => i.id === id);
  if (idx === -1) return;
  
  const item = inventory[idx];
  balance += Math.floor(item.finalPrice);
  inventory.splice(idx, 1);
  
  updateUI();
}

// --- ПРОКАЧКА ---
function upgradeLuck() {
  const cost = 500 + luckLvl * 300;
  if (balance < cost || luckLvl >= 10) return;
  balance -= cost;
  luckLvl++;
  updateUI();
}

function upgradeSell() {
  const cost = 800 + sellLvl * 500;
  if (balance < cost || sellLvl >= 10) return;
  balance -= cost;
  sellLvl++;
  updateUI();
}

function closeModal() {
  document.getElementById('winModal').classList.remove('show');
}

// Запуск
updateUI();
</script>
</body>
</html>
