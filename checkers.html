<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Неоновые Шашки</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0a12;
  font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#fff;
  display:flex;justify-content:center;align-items:center}

#app{position:relative;width:100%;max-width:600px;height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}

/* HUD */
.hud{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;margin-bottom:5px}
.player-info{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;transition:0.3s}
.piece-icon{width:24px;height:24px;border-radius:50%;box-shadow:0 0 10px currentColor}
.piece-icon.white{background:#5be3ff;color:#5be3ff}
.piece-icon.black{background:#ff5b7f;color:#ff5b7f}
.turn-indicator{font-size:14px;color:#9aa0c0;letter-spacing:1px;padding:5px 15px;border-radius:20px;background:rgba(255,255,255,0.05);transition:0.3s}
.active-turn{color:#5bff9d;background:rgba(91,255,157,0.1);box-shadow:0 0 15px rgba(91,255,157,0.3)}

/* Доска */
.board-container{flex:1;display:flex;justify-content:center;align-items:center;width:100%;padding:10px;position:relative}
canvas{background:#1a1a2e;border-radius:16px;box-shadow:0 0 40px rgba(160,107,255,0.2), inset 0 0 20px rgba(0,0,0,0.8);border:2px solid rgba(255,255,255,0.1);max-width:100%;max-height:100%;touch-action:none;cursor:pointer;transition:0.3s}
canvas.thinking{opacity:0.7;filter:blur(2px);pointer-events:none}

/* Индикатор ИИ */
#aiThinking{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(160,107,255,0.9);padding:12px 24px;border-radius:20px;font-weight:900;font-size:18px;
  box-shadow:0 0 30px rgba(160,107,255,0.8);display:none;z-index:5;animation:pulseThink 1s infinite alternate}
@keyframes pulseThink{from{transform:translate(-50%,-50%) scale(0.95)}to{transform:translate(-50%,-50%) scale(1.05)}}

/* Кнопки */
.controls{display:flex;gap:10px;margin-bottom:20px}
.btn{padding:12px 30px;border:none;border-radius:12px;font-size:16px;font-weight:900;
  font-family:inherit;cursor:pointer;transition:0.2s;background:linear-gradient(135deg,#a06bff,#6b3fcf);color:#fff;box-shadow:0 5px 15px rgba(160,107,255,0.4)}
.btn:hover{filter:brightness(1.15);transform:scale(1.05)}
.btn:active{transform:scale(0.95)}

/* Стартовый экран */
#startScreen{position:absolute;inset:0;background:rgba(10,10,26,0.95);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20;text-align:center}
#startScreen.hidden{display:none}
#startScreen h1{font-size:42px;margin-bottom:20px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(90deg,#5be3ff,#5bff9d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#startScreen p{color:#9aa0c0;margin-bottom:30px;font-size:16px}

/* Оверлей победы */
.overlay{position:absolute;inset:0;background:rgba(10,10,26,0.9);backdrop-filter:blur(10px);
  display:none;flex-direction:column;justify-content:center;align-items:center;z-index:10;text-align:center}
.overlay.show{display:flex;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.overlay h1{font-size:40px;margin-bottom:20px;background:linear-gradient(90deg,#5be3ff,#5bff9d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* Кнопка В Хаб */
.back-hub-btn {
  position: fixed; top: 20px; left: 20px; z-index: 2147483647;
  background: linear-gradient(135deg, #a06bff, #6b3fcf); color: #fff; text-decoration: none;
  font-weight: 900; font-size: 16px; padding: 12px 24px; border-radius: 30px;
  border: 3px solid #fff; box-shadow: 0 0 20px rgba(160,107,255,0.8);
  display: flex; align-items: center; gap: 8px; font-family: inherit;
  animation: pulseBtn 1.5s infinite; transition: transform 0.2s;
}
.back-hub-btn:hover { transform: scale(1.1); background: linear-gradient(135deg, #b07cff, #7b4fdf); }
@keyframes pulseBtn {
  0% { box-shadow: 0 0 0 0 rgba(160, 107, 255, 0.8); }
  70% { box-shadow: 0 0 0 15px rgba(160, 107, 255, 0); }
  100% { box-shadow: 0 0 0 0 rgba(160, 107, 255, 0); }
}
</style>
</head>
<body>

<a href="index.html" class="back-hub-btn">🏠 В Хаб</a>

<div id="app">
  <div class="hud">
    <div class="player-info" id="pWhite"><div class="piece-icon white"></div> <span id="scoreW">12</span></div>
    <div class="turn-indicator" id="turnText">Ход белых</div>
    <div class="player-info" id="pBlack"><div class="piece-icon black"></div> <span id="scoreB">12</span></div>
  </div>

  <div class="board-container">
    <div id="aiThinking">🤖 Бот думает...</div>
    <canvas id="cv"></canvas>
  </div>

  <div class="controls">
    <button class="btn" onclick="showStartScreen()">Заново</button>
  </div>

  <!-- Стартовый экран -->
  <div id="startScreen">
    <h1>ШАШКИ</h1>
    <p>Правило обязательного битья включено</p>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <button class="btn" onclick="initGame('pve')">🤖 Играть с Ботом</button>
      <button class="btn" onclick="initGame('pvp')" style="background:#444; box-shadow:none;">👥 Игра на двоих</button>
    </div>
  </div>

  <div class="overlay" id="gameOverScreen">
    <h1 id="winTitle">ПОБЕДА!</h1>
    <button class="btn" onclick="showStartScreen()">Играть ещё</button>
  </div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

let CELL_SIZE = 0;
let W = 0, H = 0;

let board = [];
let turn = 1; // 1 - белые (игрок), 2 - черные (бот/игрок)
let selectedPiece = null;
let validMoves = [];
let gameOver = false;
let gameMode = 'pve'; // 'pve' или 'pvp'
let isAiThinking = false;

const COLORS = {
  boardLight: '#2a2a3e',
  boardDark: '#1a1a2e',
  white: '#5be3ff',
  whiteKing: '#5bff9d',
  black: '#ff5b7f',
  blackKing: '#ff9a5b',
  select: 'rgba(255, 216, 107, 0.5)',
  move: 'rgba(91, 227, 255, 0.6)',
  capture: 'rgba(255, 91, 127, 0.6)',
  mustCapture: 'rgba(255, 91, 127, 0.8)'
};

// --- ЗВУКИ ---
let audioCtx = null;
function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'move') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'capture') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  } else if (type === 'win') {
    osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.1);
    osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }
}

// --- РАЗМЕРЫ ---
function resize() {
  const container = cv.parentElement.getBoundingClientRect();
  const size = Math.min(container.width, container.height) - 20;
  const dpr = window.devicePixelRatio || 1;
  
  cv.width = size * dpr;
  cv.height = size * dpr;
  cv.style.width = size + 'px';
  cv.style.height = size + 'px';
  
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  W = size; H = size;
  CELL_SIZE = W / 8;
  drawBoard();
}
window.addEventListener('resize', resize);

// --- ИНИЦИАЛИЗАЦИЯ ---
function showStartScreen() {
  document.getElementById('startScreen').classList.remove('hidden');
  document.getElementById('gameOverScreen').classList.remove('show');
  gameOver = true;
}

function initGame(mode) {
  initAudio();
  gameMode = mode;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.remove('show');
  
  board = Array.from({length: 8}, () => Array(8).fill(0));
  
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if ((r + c) % 2 !== 0) {
        if (r < 3) board[r][c] = 2; 
        if (r > 4) board[r][c] = 1; 
      }
    }
  }
  
  turn = 1;
  selectedPiece = null;
  validMoves = [];
  gameOver = false;
  isAiThinking = false;
  
  updateHUD();
  resize();
}

function updateHUD() {
  const wScore = board.flat().filter(p => p === 1 || p === 3).length;
  const bScore = board.flat().filter(p => p === 2 || p === 4).length;
  document.getElementById('scoreW').textContent = wScore;
  document.getElementById('scoreB').textContent = bScore;
  
  const turnText = document.getElementById('turnText');
  if (turn === 1) {
    turnText.textContent = "Ход белых";
    turnText.className = "turn-indicator active-turn";
    document.getElementById('pWhite').style.opacity = 1;
    document.getElementById('pBlack').style.opacity = 0.5;
  } else {
    turnText.textContent = gameMode === 'pve' ? "Бот думает..." : "Ход черных";
    turnText.className = "turn-indicator active-turn";
    document.getElementById('pWhite').style.opacity = 0.5;
    document.getElementById('pBlack').style.opacity = 1;
  }
}

// --- ОТРИСОВКА ---
function drawBoard() {
  ctx.clearRect(0, 0, W, H);
  
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? COLORS.boardLight : COLORS.boardDark;
      ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      
      // Подсветка выбранной
      if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) {
        ctx.fillStyle = COLORS.select;
        ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      }
      
      // Подсветка ходов
      const move = validMoves.find(m => m.r === r && m.c === c);
      if (move) {
        ctx.beginPath();
        ctx.arc(c * CELL_SIZE + CELL_SIZE/2, r * CELL_SIZE + CELL_SIZE/2, CELL_SIZE/6, 0, Math.PI * 2);
        ctx.fillStyle = move.capture ? COLORS.capture : COLORS.move;
        ctx.fill();
      }
    }
  }
  
  // Рисуем шашки
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const piece = board[r][c];
      if (piece !== 0) {
        drawPiece(r, c, piece);
      }
    }
  }
}

function drawPiece(r, c, piece) {
  const x = c * CELL_SIZE + CELL_SIZE / 2;
  const y = r * CELL_SIZE + CELL_SIZE / 2;
  const radius = CELL_SIZE * 0.35;
  
  const isWhite = piece === 1 || piece === 3;
  const isKing = piece === 3 || piece === 4;
  
  // Тень
  ctx.shadowBlur = 15;
  ctx.shadowColor = isWhite ? COLORS.white : COLORS.black;
  
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = isWhite ? COLORS.white : COLORS.black;
  ctx.fill();
  
  // Блик
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.arc(x - radius*0.2, y - radius*0.2, radius*0.6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fill();
  
  // Дамка
  if (isKing) {
    ctx.beginPath();
    ctx.arc(x, y, radius * 0.5, 0, Math.PI * 2);
    ctx.fillStyle = isWhite ? COLORS.whiteKing : COLORS.blackKing;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

// --- ЛОГИКА ДВИЖЕНИЯ ---
function getValidMoves(r, c) {
  const piece = board[r][c];
  if (piece === 0) return [];
  
  const isWhite = piece === 1 || piece === 3;
  const isKing = piece === 3 || piece === 4;
  const moves = [];
  
  const dirs = isKing ? [[-1,-1],[-1,1],[1,-1],[1,1]] : (isWhite ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]]);
  
  // 1. Проверка на взятие
  for (let [dr, dc] of dirs) {
    const r1 = r + dr, c1 = c + dc;
    const r2 = r + dr*2, c2 = c + dc*2;
    
    if (r2 >= 0 && r2 < 8 && c2 >= 0 && c2 < 8) {
      const target = board[r1][c1];
      const land = board[r2][c2];
      
      if (target !== 0 && (target === 1 || target === 3) !== isWhite && land === 0) {
        moves.push({ r: r2, c: c2, capture: { r: r1, c: c1 } });
      }
    }
  }
  
  if (moves.length > 0) return moves;
  
  // 2. Обычные ходы
  for (let [dr, dc] of dirs) {
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && board[nr][nc] === 0) {
      moves.push({ r: nr, c: nc, capture: null });
    }
  }
  
  return moves;
}

function hasMoves(player) {
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = board[r][c];
      if (p === 0) continue;
      const isWhite = p === 1 || p === 3;
      if ((player === 1 && !isWhite) || (player === 2 && isWhite)) continue;
      if (getValidMoves(r, c).length > 0) return true;
    }
  }
  return false;
}

function checkWin() {
  const wScore = board.flat().filter(p => p === 1 || p === 3).length;
  const bScore = board.flat().filter(p => p === 2 || p === 4).length;
  
  let winner = 0;
  if (wScore === 0 || !hasMoves(1)) winner = 2;
  else if (bScore === 0 || !hasMoves(2)) winner = 1;
  
  if (winner) {
    gameOver = true;
    playSound('win');
    const title = document.getElementById('winTitle');
    if (winner === 1) {
      title.textContent = "ПОБЕДА БЕЛЫХ!";
      title.style.background = "linear-gradient(90deg,#5be3ff,#5bff9d)";
    } else {
      title.textContent = "ПОБЕДА ЧЕРНЫХ!";
      title.style.background = "linear-gradient(90deg,#ff5b7f,#ffd86b)";
    }
    title.style.webkitBackgroundClip = "text";
    document.getElementById('gameOverScreen').classList.add('show');
  }
}

// --- ИГРОВОЙ ЦИКЛ (КЛИКИ) ---
cv.addEventListener('pointerdown', (e) => {
  if (gameOver || isAiThinking) return;
  if (gameMode === 'pve' && turn === 2) return; // Блокируем клики во время хода бота
  
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const c = Math.floor(x / CELL_SIZE);
  const r = Math.floor(y / CELL_SIZE);
  
  if (r < 0 || r >= 8 || c < 0 || c >= 8) return;
  
  const piece = board[r][c];
  const isWhite = piece === 1 || piece === 3;
  const isBlack = piece === 2 || piece === 4;
  
  // Клик по своей шашке
  if ((turn === 1 && isWhite) || (turn === 2 && isBlack)) {
    selectedPiece = { r, c };
    validMoves = getValidMoves(r, c);
    drawBoard();
    return;
  }
  
  // Клик по ходу
  if (selectedPiece) {
    const move = validMoves.find(m => m.r === r && m.c === c);
    if (move) {
      executeMove(selectedPiece.r, selectedPiece.c, move);
      return;
    }
  }
  
  selectedPiece = null;
  validMoves = [];
  drawBoard();
});

// Выполнение хода (общая функция для игрока и бота)
function executeMove(fromR, fromC, move) {
  const pieceToMove = board[fromR][fromC];
  board[fromR][fromC] = 0;
  
  if (move.capture) {
    board[move.capture.r][move.capture.c] = 0;
    playSound('capture');
    spawnParticles(move.capture.c * CELL_SIZE + CELL_SIZE/2, move.capture.r * CELL_SIZE + CELL_SIZE/2, pieceToMove === 1 || pieceToMove === 3 ? '#ff5b7f' : '#5be3ff');
  } else {
    playSound('move');
  }
  
  board[move.r][move.c] = pieceToMove;
  
  // Превращение в дамку
  if (pieceToMove === 1 && move.r === 0) board[move.r][move.c] = 3;
  if (pieceToMove === 2 && move.r === 7) board[move.r][move.c] = 4;
  
  selectedPiece = null;
  validMoves = [];
  
  // Мульти-взятие
  const nextMoves = getValidMoves(move.r, move.c);
  if (move.capture && nextMoves.some(m => m.capture)) {
    if (turn === 1 || gameMode === 'pvp') {
      selectedPiece = { r: move.r, c: move.c };
      validMoves = nextMoves;
      drawBoard();
      updateHUD();
    } else {
      // Бот продолжает бить
      setTimeout(() => executeMove(move.r, move.c, nextMoves.find(m => m.capture)), 500);
    }
    return;
  }
  
  turn = turn === 1 ? 2 : 1;
  updateHUD();
  checkWin();
  drawBoard();
  
  // Запуск хода бота
  if (gameMode === 'pve' && turn === 2 && !gameOver) {
    isAiThinking = true;
    document.getElementById('aiThinking').style.display = 'block';
    cv.classList.add('thinking');
    setTimeout(makeAiMove, 600);
  }
}

// Частицы
let particles = [];
function spawnParticles(x, y, color) {
  for (let i=0; i<10; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      life: 1, color
    });
  }
  requestAnimationFrame(animateParticles);
}
function animateParticles() {
  if (particles.length === 0) return;
  particles.forEach((p, i) => {
    p.x += p.vx; p.y += p.vy; p.life -= 0.05;
    if (p.life <= 0) particles.splice(i, 1);
  });
  drawBoard();
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  if (particles.length > 0) requestAnimationFrame(animateParticles);
}

// --- ИИ (МИНИМАКС) ---
function makeAiMove() {
  const allMoves = getAllMoves(2);
  
  if (allMoves.length === 0) {
    checkWin();
    return;
  }
  
  let bestMove = allMoves[0];
  let bestScore = -Infinity;
  
  // Глубина 2: Бот делает ход, смотрит лучший ответ игрока, оценивает позицию
  for (let move of allMoves) {
    const boardClone = board.map(row => [...row]);
    applyMoveToBoard(boardClone, move);
    
    const score = evaluateBoard(boardClone);
    if (score > bestScore) {
      bestScore = score;
      bestMove = move;
    }
  }
  
  isAiThinking = false;
  document.getElementById('aiThinking').style.display = 'none';
  cv.classList.remove('thinking');
  
  executeMove(bestMove.fromR, bestMove.fromC, bestMove);
}

function getAllMoves(player) {
  const moves = [];
  for (let r=0; r<8; r++) {
    for (let c=0; c<8; c++) {
      const p = board[r][c];
      if (p === 0) continue;
      const isWhite = p === 1 || p === 3;
      if ((player === 1 && !isWhite) || (player === 2 && isWhite)) continue;
      
      const pieceMoves = getValidMoves(r, c);
      for (let m of pieceMoves) {
        moves.push({ fromR: r, fromC: c, ...m });
      }
    }
  }
  return moves;
}

function applyMoveToBoard(b, move) {
  const piece = b[move.fromR][move.fromC];
  b[move.fromR][move.fromC] = 0;
  if (move.capture) b[move.capture.r][move.capture.c] = 0;
  
  // Превращение
  let finalPiece = piece;
  if (piece === 2 && move.r === 7) finalPiece = 4;
  b[move.r][move.c] = finalPiece;
}

function evaluateBoard(b) {
  let score = 0;
  for(let r=0; r<8; r++) {
    for(let c=0; c<8; c++) {
      const p = b[r][c];
      // Бот (Черные, 2 и 4) хочет максимизировать счет
      if (p === 2) score += 10;
      if (p === 4) score += 30; // Дамки ценнее
      if (p === 1) score -= 10;
      if (p === 3) score -= 30;
      
      // Продвижение к другому краю
      if (p === 2) score += r * 0.5; 
      if (p === 1) score -= (7 - r) * 0.5;
    }
  }
  return score;
}

// Запуск
showStartScreen();
resize();
</script>
<script src="back.js"></script>
</body>
</html>
